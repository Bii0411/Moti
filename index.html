<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>moti</title>
<meta name="moti-version" content="20261126-0006">
<style>
:root{--bg:#0b0a12;--card:#17151f;--line:#2a2635;--text:#f2effa;--sub:#a59fb8;--pri:#8b5cf6;--pri2:#c4b5fd;--gold:#f5c66b;--pink:#f472b6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;background:#050409;color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{width:100%;max-width:440px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;overflow:clip}
header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
header h1{font-size:18px;font-weight:800;flex:none}
/* 35: 로고 「moti」 = assets/logo_moti.svg. 59: 기획자 시안 로고(굵은 글자)를 따라 그린 그림으로 바꿈(비율 494.25:151). 글자색(currentColor)으로 칠함(마스크). 크기는 높이만 주면 가로는 그림 비율대로.
   아래 끝이 글자 기준선에 오게 vertical-align:baseline(예전 글자 로고와 같은 자리). 안의 .sr 「moti」는 화면에 안 보이는 검색·복사용 글자 */
.logo{display:inline-block;vertical-align:baseline;height:1em;width:calc(var(--lh,1em)*3.2732);background:currentColor;-webkit-mask:url(assets/logo_moti.svg) center/100% 100% no-repeat;mask:url(assets/logo_moti.svg) center/100% 100% no-repeat}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
header h1 .logo{--lh:14px;height:14px}
/* 다른 캐릭터 알림(6-C): 헤더 안, 로고와 💎 사이 빈자리에 한 줄. 길면 말줄임, 누르면 그 대화방으로 */
.hnote{flex:1;min-width:0;display:flex;justify-content:flex-start}
.hnote button{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600;color:var(--text);background:#211b33;border:1px solid #6d4bd1;border-radius:999px;padding:5px 10px;opacity:0;transform:translateY(-3px);transition:opacity .25s,transform .25s;pointer-events:none}
.hnote button.on{opacity:1;transform:none;pointer-events:auto}
.hnote button b{font-weight:800}
header h1 small{font-size:12px;color:var(--sub);font-weight:500;margin-left:6px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.demo-btn{font-size:12px;color:var(--sub);border:1px dashed var(--line);border-radius:999px;padding:6px 10px}
/* 설정(톱니바퀴) 버튼(6-B): 헤더 오른쪽 끝. 보조 글자색, 누르거나 올리면 본문 글자색. 누르면 시연 패널을 열고 닫음 */
.gear{flex:none;width:34px;height:34px;margin-right:-6px;display:grid;place-items:center;border-radius:50%;color:var(--sub);transition:color .15s;-webkit-tap-highlight-color:transparent}
.gear svg{width:21px;height:21px;display:block}
.gear:hover,.gear:active,.gear:focus-visible,.gear.on{color:var(--text)}

.stage{position:relative;height:36%;min-height:210px;margin:0 12px;border-radius:20px;overflow:hidden;background:#140a24 center 40%/cover no-repeat;transition:background-image .6s}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
/* 배경 어둡게(4-2B): 배경 이미지와 3D 사이에 반투명 층. 필터 대신(아이폰 사파리 부담 줄이기). 값은 data/look.json background, ?bg=raw 면 끔 */
.stage{isolation:isolate}
.bgdim{position:absolute;inset:0;pointer-events:none;background:rgba(0,0,0,var(--bgDark,.2))}
.bgdim::after{content:"";position:absolute;inset:0;background:#808080;mix-blend-mode:saturation;opacity:var(--bgDesat,.1)}
.bgdim.raw{display:none}
.stage .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:13px;background:#0008}
.where{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;background:#000a;padding:5px 10px;border-radius:999px}
/* 오른쪽 위 관계 단계·게이지·기분 태그(19). 색·시간 data/config.json bondTop·moodTag. 블러·그림자 없이 transform 띠만 */
.btop{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.btop .bx{display:inline-flex;flex-direction:column;background:#000a;padding:5px 10px 6px;border-radius:10px}
.btop #bondTxt{font-size:12px;font-weight:700;line-height:1.25;white-space:nowrap}
/* 21: 단계 = 선 하트 안 숫자(5 엇갈림은 금 간 선). 하트 선·숫자 색 = 그 단계 게이지 색, 단계가 오르면 colorMs 동안 바뀜 */
.btop .brow{display:flex;align-items:center;gap:5px}
#bondHeart{display:inline-flex;transition:color var(--hc,600ms) ease}
.bgauge{position:relative;display:block;height:var(--gh,4px);margin-top:4px;border-radius:9px;overflow:hidden;background:var(--gt,#ffffff2e)}
.bgauge i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px;background:var(--gc,#B4B2A9)}
.bgauge em{position:absolute;left:0;top:0;bottom:0;width:var(--sw,40%);transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--sc,#fff),transparent);opacity:0}
.mtag{font-size:10px;font-weight:700;line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap}
.mtag[hidden]{display:none}
.cap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;font-weight:700;background:#000b;padding:5px 11px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s}
.cap.on{opacity:1}
.cap .new{color:var(--gold)}
.bubble{position:absolute;left:12px;right:12px;bottom:42px;background:#0d0b16e6;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;opacity:0;transform:translateY(6px);transition:.3s}
.bubble.on{opacity:1;transform:none}
/* 앨범 다시 보기 자막: 3D 아래 칸 */
.rcap{margin:8px 12px 0;min-height:0;max-height:0;overflow:hidden;background:#0d0b16;border:1px solid transparent;border-radius:14px;padding:0 12px;font-size:14px;line-height:1.45;opacity:0;transition:opacity .3s,max-height .3s,padding .3s}
.rcap.on{opacity:1;max-height:120px;padding:10px 12px;border-color:#ffffff22}
.app.inalbum .where,.app.inalbum .btop{display:none}
.app.inalbum .cap{font-size:11px;padding:4px 9px}
.burst{position:absolute;left:50%;bottom:12%;transform:translate(-50%,0);font-size:56px;line-height:1;opacity:0;pointer-events:none;z-index:4}
.burst.go{animation:burst 1s ease-out}  /* 50-2: 선물 그림은 3D 칸 가운데 아래에서 1초 떠올랐다 사라짐 → 그 뒤 반응 몸짓 */
/* 희귀·특별 새 몸짓 알림(9-B): 무대 위 글자 + (특별만) 무대를 살짝 어둡게. 글자·색·크기·투명도만, 전환(transition)이라 화면을 옮겨도 다시 재생되지 않음. 값 data/collection.json notify */
/* 17-B 새 몸짓 알림 카드(레어·시크릿): 무대 아래쪽에서 올라왔다 사라짐. 시크릿만 무대를 어둡게(--gfDim). 값은 data/collection.json notify */
.gradefx{position:absolute;inset:0;pointer-events:none;z-index:3;background:rgba(0,0,0,var(--gfDim,0));opacity:0;transition:opacity var(--gfFade,400ms) ease}
.gradefx.on{opacity:1;transition:opacity var(--gfRise,400ms) ease}
.gcard{position:absolute;left:50%;bottom:var(--gfBottom,12px);width:var(--gfW,210px);margin-left:calc(var(--gfW,210px) / -2);box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 12px 9px 9px;background:var(--gfBg,rgba(13,11,22,.85));border:1px solid var(--gfColor,#fff);border-radius:var(--gfRadius,14px);transform:translateY(var(--gfRisePx,18px));transition:transform var(--gfFade,400ms) ease}
.gradefx.on .gcard{transform:translateY(0);transition:transform var(--gfRise,400ms) cubic-bezier(.2,.8,.3,1)}
.gcard i{flex:none;width:var(--gfBox,36px);height:var(--gfBox,36px);border-radius:9px;border:1px solid var(--gfColor,#fff);background:var(--gfSoft,transparent)}
.gcard span{min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.3}
.gcard .g{font-size:10px;font-weight:700;color:var(--gfColor,#fff)}
.gcard b{font-size:14px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .c{font-size:10px;color:var(--sub)}
/* 17-2 이미 모은 몸짓(선물): 같은 카드를 흐리게(회색 테두리·글자). 무대는 어둡게 하지 않음 */
.gradefx.muted .gcard{opacity:var(--gfMuted,.75)}
/* 36: 등급 테두리(edge) = 무대 어둡게 대신 가장자리 선. 작은 카드(lite) = 두 줄·색 막대·더 비침 */
.gradefx.edge{box-shadow:inset 0 0 0 var(--gfEdge,2px) var(--gfColor,#fff);border-radius:inherit}
.gradefx.lite .gcard{width:var(--gfLiteW,168px);margin-left:calc(var(--gfLiteW,168px) / -2);padding:7px 12px;gap:8px;background:var(--gfLiteBg,rgba(13,11,22,.55))}
.gradefx.lite .gcard i{width:8px;height:28px;border:0;border-radius:4px;background:var(--gfColor,#fff)}
.gradefx.lite .gcard .c{display:none}
.gradefx.muted .gcard b{color:var(--sub)}
.stage.gfon .cap,.stage.gfon .bubble{opacity:0}  /* 17-2: 선물 대사 자막(#bubble)도 카드 동안 숨김 */
@keyframes burst{0%{opacity:0;transform:translate(-50%,40%) scale(.7)}30%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1;transform:translate(-50%,-25%) scale(1)}100%{opacity:0;transform:translate(-50%,-55%) scale(.95)}}
@keyframes burstStill{0%{opacity:0}20%{opacity:1}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.burst.go{animation:burstStill 1s linear;transform:translate(-50%,0)}}

main{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;min-width:0;display:none;flex-direction:column}
.view.on{display:flex}

/* 대화 */
.log{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:12px 14px 6px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;overflow-wrap:anywhere;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.c{background:var(--card);align-self:flex-start;border-top-left-radius:6px}
.msg.u{background:var(--pri);align-self:flex-end;border-top-right-radius:6px}
.fbretry{align-self:flex-start;margin:2px 0 4px 4px;font:inherit;font-size:12px;font-weight:700;color:var(--pri2);background:#1d1830;border:1px solid #3a2f5c;border-radius:999px;padding:5px 12px;cursor:pointer}
.mnarr{align-self:flex-start;max-width:88%;overflow-wrap:anywhere;font-size:13px;line-height:1.55;color:#a39cb8;font-style:italic;padding:0 4px}
.mnarr.u{align-self:flex-end;text-align:right}
.msg.sys{align-self:center;background:none;color:var(--sub);font-size:12px;text-align:center;max-width:95%}
.msg.gift{align-self:flex-end;background:#2a1d47;border:1px solid #6d4bd1}
.msg .tag{display:inline-block;margin-top:5px;font-size:11px;color:var(--gold);font-weight:700}
.typing{color:var(--sub)}
.bar{display:flex;gap:8px;padding:8px 12px 12px;align-items:flex-end;min-width:0}
/* ＋ 기능판(10-A): ＋ 버튼(누르면 ×) → 입력칸 아래(키보드 자리)에 한 줄 4칸. 아이콘은 모두 같은 선 아이콘(굵기 1.8, 둥근 끝)·같은 칸·같은 글자.
   선물하기만 칸 바탕을 보라 강조색으로(크기·모양은 같고 색으로만). 빛·그라데이션·입체·반짝이는 테두리 없음 */
.fnbtn{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:#d9d2ee;-webkit-tap-highlight-color:transparent}
.fnbtn svg{width:24px;height:24px;display:block;transition:transform .2s}
.fnbtn.on svg{transform:rotate(45deg)}
.fnp{flex:none;max-height:0;overflow:hidden;transition:max-height .22s ease;background:#0e0c16}
.fnp.on{max-height:calc(140px + env(safe-area-inset-bottom,0px))}
.fngrid{display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.fni{display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 0;-webkit-tap-highlight-color:transparent}
.fni .tile{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:#1d1a27;color:#d9d2ee;transition:transform .1s}
.fni .tile svg{width:26px;height:26px;display:block}
.fni b{font-size:12px;font-weight:600;color:#cfc8e4}
.fni:active .tile{transform:scale(.95)}
/* 여러 줄 입력창: 엔터는 줄바꿈, 4줄까지 커지고 그 이상은 안에서 스크롤 (autoGrow). 16px = 아이폰 자동 확대 방지 */
.inp{flex:1;min-width:0;width:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:11px 15px;color:var(--text);font:inherit;font-size:16px;line-height:22px;outline:none;resize:none;display:block;height:46px;max-height:112px;overflow-y:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
/* 안내 문구가 길어 두 줄: 글자만 13px로 줄이고(입력 글자는 16px 그대로) 빈 칸일 때만 위아래 여백을 줄여 46px 안에 넣음 */
.inp::placeholder{color:#6b6480;font-size:13px;line-height:17px}
.inp:placeholder-shown{padding-top:5px;padding-bottom:5px;word-break:keep-all;overflow-wrap:normal}
.abtn{flex:none;height:46px;padding:0 9px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--pri2);line-height:1.15}
.send{width:46px;height:46px;border-radius:50%;background:var(--pri);font-size:18px;font-weight:800;flex:none}

/* 앨범 */
.album{flex:1;overflow-y:auto;padding:12px 14px 16px}
.alh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.alh b{font-size:16px}
.alh span{color:var(--gold);font-weight:800;font-size:14px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#f472b6);border-radius:9px;transition:width .5s}
.alnote{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{aspect-ratio:3/4;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;text-align:center;font-size:11px;position:relative;overflow:hidden}
.slot .e{font-size:24px}
.slot .s{font-weight:700}
.slot .d{color:var(--sub);font-size:10px}
.slot.got{background:linear-gradient(160deg,#2b1f4a,#1a1426);border-color:#6d4bd1}
.slot.got::after{content:"▶";position:absolute;right:6px;top:5px;font-size:10px;color:var(--pri2)}
.slot.lock .e{filter:brightness(0) invert(.25)}
.slot.lock .s{color:#6b6480}
.colempty{font-size:12px;color:var(--sub);text-align:center;line-height:1.6;padding:28px 16px;word-break:keep-all}
.aseg{display:flex;gap:6px;margin-bottom:12px}
.aseg button{flex:1;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--sub)}
.aseg button.on{background:var(--pri);border-color:var(--pri);color:var(--text)}
.slot .hint{color:#9d95b5;font-size:10px;line-height:1.35;word-break:keep-all;padding:0 2px}
.slot .ln{color:#cfc8e4;font-size:10px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.soon{border:1px dashed #6d4bd1;background:#1b1628}
.slot.soon .hint{color:var(--pri2)}
/* 처음 본 모습 작은 표시: 애니메이션이 아닌 전환(transition)이라 화면을 옮겨도 다시 재생되지 않음 */
.firstchip{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top, 0px));transform:translate(-50%,-6px);background:#211b33e6;border:1px solid #f5c66b88;color:var(--gold);font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;opacity:0;transition:opacity .25s,transform .25s;z-index:29;white-space:nowrap;pointer-events:none}
.firstchip.on{opacity:1;transform:translate(-50%,0)}
.slot.fresh{animation:fresh 1.6s ease-out}
/* 명장면 수집(9-B): 한 줄 3칸, 왼쪽 위 등급(색으로 구분), 얻은 칸 테두리도 등급 색 */
.colh{font-size:16px;margin:2px 0 10px;display:flex;align-items:center;gap:6px}
/* 26: 제목 옆 (!) 버튼 · 소개 창(#mini 안). 26-1: 얻은 칸 작은 창은 카드 확대(cards.css)로 바뀜 */
.colinfo{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--sub);margin:-4px 0;-webkit-tap-highlight-color:transparent}
.colintro p{font-size:14px;line-height:1.5;margin:0 2px 10px;word-break:keep-all}
.colintro ul{margin:0 0 12px;padding:10px 12px 10px 28px;background:#ffffff0a;border-radius:12px;font-size:13px;line-height:1.7;color:var(--text)}
.colintro ul:has(b){list-style:none;padding:12px 14px;display:flex;flex-direction:column;gap:8px;line-height:1.4}  /* 60: 이름 + 설명 줄 */
.colintro ul:has(b) li{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}.colintro li b{color:#c9b8ff;font-weight:800;white-space:nowrap}.colintro li span{color:var(--text);word-break:keep-all}
.colintro .ft{font-size:12px;color:var(--sub)}
.colintro .ok{display:block;width:100%;height:44px;margin-top:4px;border-radius:12px;background:var(--pri);color:var(--text);font-size:14px;font-weight:800}
.alh.col{justify-content:space-between;margin-top:2px}
.alh.col b{font-size:13px;color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums}
.slots.c3{grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.slots.c3 .slot{aspect-ratio:auto;min-height:132px;padding:24px 6px 8px;justify-content:flex-start;gap:4px}
.slot .gr{position:absolute;left:6px;top:6px;font-size:10px;font-weight:800;color:var(--gc,#a7b0c4);border:1px solid var(--gc,#a7b0c4);border-radius:999px;padding:1px 6px;line-height:1.3}
.slots.c3 .slot.got{border-color:var(--gc,#6d4bd1)}
.slots.c3 .slot .e{font-size:22px}
.slots.c3 .slot .s{font-size:12px;line-height:1.3;word-break:keep-all}
.slot .d.pl{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 56: 선물 창 새 디자인 — 보라 유리 카드, 투명 선 그림(icons/gift2_*.png), 그림과 이름 사이 가는 줄 */

  background:radial-gradient(120% 70% at 100% 100%,rgba(170,140,255,.16),transparent 55%),linear-gradient(165deg,rgba(64,52,96,.62),rgba(28,24,42,.82));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 14px rgba(160,130,255,.08)}
#giftSheet .item.gt .gi{width:100%;height:62px;margin:12px 0 8px;border-radius:0;box-shadow:none;background:none}
#giftSheet .item.gt .gi.g2{width:82px;height:62px}
#giftSheet .item.gt .gi.ge{width:100%;font-size:32px}
#giftSheet .item.gt b{font-size:13.5px;font-weight:800;color:#f3efff;margin-top:0;padding-top:8px;width:100%;border-top:1px solid rgba(255,255,255,.07)}
#giftSheet .item.gt .p{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;color:#cbbcff;margin-top:2px}
#giftSheet .item.gt.match{border-color:rgba(206,188,255,.85);box-shadow:0 0 14px rgba(150,115,255,.35),inset 0 0 16px rgba(170,140,255,.14)}
#giftSheet .item.gt .rec{right:6px;top:6px;font-size:9.5px;font-weight:700;color:#efeaff;background:rgba(170,148,240,.28);border:1px solid rgba(210,195,255,.45);padding:2px 7px}
#giftSheet .item.locked{opacity:1;border-color:rgba(190,168,255,.14);background:linear-gradient(165deg,rgba(44,38,62,.5),rgba(24,21,34,.75))}

#giftSheet .gsub{color:#a99ad6;font-size:11.5px;margin:-2px 2px 10px 13px}
.mhero .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mhero .mtag{align-self:flex-start;font-size:10px;font-weight:800;color:#1d1730;background:linear-gradient(120deg,#b9873a,#f5c66b 45%,#fff0c6 60%,#e0ad4c);border-radius:999px;padding:2px 8px}
.mhero b{font-size:16px}.mhero small{font-size:12px;color:#e8dcc0;line-height:1.35}
.mhero .mcard{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.2px}
.mhero .mp{flex:none;font-size:13px;font-weight:800;color:var(--pri2)}
.gguide{text-align:center;padding:22px 20px 22px}
.gguide .gg-lock{width:54px;height:54px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;background:#241f33;color:var(--gold)}.gguide .gg-lock svg{width:28px;height:28px}
.gguide h2{font-size:16px;margin-bottom:8px}.gguide p{font-size:13px;color:#d6cfe6;line-height:1.6;margin-bottom:16px;word-break:keep-all}
.gguide .cta{width:100%;padding:12px;border-radius:12px;background:var(--pri);font-weight:800;font-size:14px}
/* 51: 끝 화면(입력창 자리) · 처음부터 확인창 */
.endbox{padding:12px 14px 14px;border-top:1px solid var(--line);background:#100e17;text-align:center}
.endbox h3{font-size:15px;margin-bottom:4px}.endbox p{font-size:12.5px;color:#d6cfe6;line-height:1.55;margin-bottom:10px;word-break:keep-all;white-space:pre-line}
.endbox .row{display:flex;gap:8px}.endbox button{flex:1;padding:11px 8px;border-radius:12px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.endbox .rw{background:var(--gold);color:#1a1424}.endbox .rw:disabled{opacity:.45}.endbox .rw small{font-weight:700;font-size:12px;opacity:.9;display:inline-flex;align-items:center;gap:2px}
.endbox .rs{background:#241f33;color:var(--text)}.endbox .free{font-size:12px;color:var(--gold);margin-top:8px}
.endbox .note{font-size:11.5px;color:var(--sub);margin-top:8px;word-break:keep-all}
/* 54 엔딩 기록(마이) */
.endrec ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:10px}
.endrec li{border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:2px;opacity:.38}
.endrec li b{font-size:14px}.endrec li small{font-size:11.5px;color:var(--sub)}
.endrec li.on{opacity:1;border-color:#c9a24d;background:linear-gradient(135deg,#2a2236,#1b1726)}.endrec li.on b{color:var(--gold)}
.rwc .row{display:flex;gap:8px}.rwc .row .cta{flex:1;width:auto}.rwc .cta.no{background:#241f33}
/* 50: 순간 선물이 열리면 ＋ 버튼이 금빛(포토카드 SECRET 금색) + 작은 점 */
.fnbtn{position:relative}
.fnbtn.mo{border-color:#f5c66b;color:#f5c66b;background:radial-gradient(circle at 50% 40%,#3a2c1c,#1d1726);animation:moGlow 1.8s ease-in-out infinite}
.fnbtn.mo::after{content:"";position:absolute;right:1px;top:1px;width:9px;height:9px;border-radius:50%;background:#f5c66b;box-shadow:0 0 0 2px #0b0a12,0 0 6px #f5c66b}
.fni.mo .tile{background:linear-gradient(150deg,#3a2c1c,#221a2c);color:#f5c66b;box-shadow:0 0 0 1.5px #f5c66b,0 0 12px #f5c66b55;position:relative}
.fni.mo .tile::after{content:"";position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:#f5c66b;box-shadow:0 0 0 2px #0e0c16}
@keyframes moGlow{0%,100%{box-shadow:0 0 0 1px #f5c66b55,0 0 8px #f5c66b55}50%{box-shadow:0 0 0 1px #f5c66baa,0 0 16px #f5c66bcc}}
@media (prefers-reduced-motion:reduce){.fnbtn.mo{animation:none;box-shadow:0 0 0 1px #f5c66baa,0 0 12px #f5c66b99}}
/* 선물 창(9-A): 기분 맞춤 선물은 금색 테두리 (49: 천장·확률 보기 없음) */
.item.match{border-color:#f5c66b99;background:linear-gradient(160deg,#2a2236,#1a1426)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.row button{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--card)}
.row button.on{background:var(--pri);border-color:var(--pri)}
.demo h4{font-size:13px;margin:4px 0 2px}
.demo p{font-size:11px;color:var(--sub);line-height:1.5}
.toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top, 0px));transform:translate(-50%,-10px);background:#211b33;border:1px solid #6d4bd1;color:var(--text);font-size:13px;font-weight:600;padding:9px 14px;border-radius:12px;opacity:0;transition:.3s;z-index:30;width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.45}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 시연 설정 패널(5단계): 헤더의 톱니바퀴 버튼(6-B)으로 열고 닫음. 문구는 data/demo.json */
.dp{position:fixed;top:0;right:0;bottom:0;width:min(340px,calc(100vw - 28px));background:#120f1cf5;border-left:1px solid var(--line);z-index:61;transform:translateX(102%);transition:transform .25s;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px calc(18px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--text)}
.dp.on{transform:none}
.dp .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dp .hd b{font-size:15px;flex:1}
.dp .hd .dbg{font-size:10px;font-weight:800;color:#000;background:var(--gold);border-radius:999px;padding:1px 7px}
.dp .hd button{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.dp h4{font-size:12px;margin:12px 0 2px;color:var(--pri2)}
.dp h4 small{color:var(--sub);font-weight:500;margin-left:4px}
.dp .row{margin:4px 0 6px;gap:5px}
.dp .row button{padding:5px 9px}
.dp .now{font-size:11px;color:var(--sub);background:#0006;border-radius:8px;padding:5px 8px;line-height:1.5}
.dp .now b{color:var(--text)}
.dp .now .rs{color:var(--gold)}
.dp .st{display:flex;align-items:center;gap:6px;margin:4px 0}
.dp .dot{width:10px;height:10px;border-radius:50%;background:#6b6480;flex:none}
.dp .dot.waking{background:#facc15}.dp .dot.awake{background:#22c55e}.dp .dot.down{background:#ef4444}
.dp .kv{color:var(--sub);line-height:1.5}
.dp details{margin-top:4px}
.dp summary{cursor:pointer;color:var(--pri2)}
.dp pre{white-space:pre-wrap;word-break:break-all;font-size:10px;line-height:1.4;background:#0008;border-radius:8px;padding:6px 8px;margin-top:4px;max-height:220px;overflow:auto}
.dp input[type=range]{flex:1;min-width:0;accent-color:var(--pri)}
.dp .aff{display:flex;align-items:center;gap:8px}
.dp .aff b{width:28px;text-align:right}
.dp .mlist{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.dp .mrow{display:flex;align-items:center;gap:5px}
.dp .mrow .pl{flex:1;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp .mrow .pl i{font-style:normal;color:var(--sub);font-size:10px;margin-left:4px}
.dp .mrow .pl.open i{color:#86efac}
.dp .mrow .pv{flex:none;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;color:var(--gold)}
.dp .keys{margin-top:12px;font-size:10px;color:var(--sub);line-height:1.5}
/* 장 제목: 장면에 들어갈 때 대화 화면 가운데 2초 (투명도·크기 전환만) */
.chapter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:32;background:#0d0b16e6;border:1px solid #f5c66b66;color:var(--gold);padding:14px 24px;border-radius:16px;font-size:20px;font-weight:800;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;white-space:nowrap}
.chapter.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* 31 첫 만남 연출: 무대가 앱 화면 전체(fixed, 자리는 FirstMeet 이 px 로) · 바깥 어둡게(fmshade) · 장소 바꿀 때 검은 막(fmveil) · 위아래 검은 띠(fmbar, transform 만) · 건너뛰기. 블러·그림자 없음 */
.stage.fm{position:fixed;margin:0;z-index:58;min-height:0}
.stage.fm>.where,.stage.fm>.btop,.stage.fm>.cap,.stage.fm>.bubble,.stage.fm>.burst,.stage.fm>.gradefx{opacity:0!important;pointer-events:none}
.fmshade{position:absolute;inset:0;z-index:57;background:#000;opacity:0;pointer-events:none;transition:opacity .5s ease}
.fmshade.on{opacity:1;pointer-events:auto}
.fmveil{position:absolute;inset:0;z-index:5;background:#000;opacity:0;pointer-events:none;transition:opacity .25s linear}
.fmveil.on{opacity:1}
.plveil{position:absolute;inset:0;background:#05040a;opacity:0;pointer-events:none;transition:opacity .3s ease}  /* 39: 장소 전환 막(무대 배경·3D 위, 장소 이름표·게이지 아래) */
.plveil.on{opacity:1}
.fmbar{position:absolute;left:0;right:0;height:var(--fmBar,11%);z-index:6;background:#000;pointer-events:none;transition:transform var(--fmBarMs,.5s) ease-in-out}
.fmbar.t{top:-1px;transform:translateY(-101%)}.fmbar.b{bottom:-1px;transform:translateY(101%)}
.fmbar.on{transform:none}
/* 37: 프롤로그 자막. 아래 띠 바로 위 가운데, 지문(.n)은 흐린 기울임, 대사(.s)는 굵게 */
.fmcap{position:absolute;left:16px;right:16px;bottom:calc(var(--fmBar,11%) + 18px);z-index:6;text-align:center;color:#fff;font-size:15px;line-height:1.5;text-shadow:0 1px 3px rgba(0,0,0,.85);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .35s ease,transform .35s ease;text-wrap:balance}
.fmcap.on{opacity:1;transform:none}
.fmcap.n{color:rgba(255,255,255,.82);font-style:italic}
.fmcap.s{font-weight:800;font-size:16px}
.fmskip{position:absolute;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:7;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s}
.fmskip.on{opacity:1;pointer-events:auto}
</style>

<script>
// ───────────────────────── 데이터 ─────────────────────────
const $=s=>document.querySelector(s);
$("#navAlbumIc").innerHTML=Icon.svg("cards",24);  // 46: 아래 탭 컬렉션 = 포토카드가 겹친 선 아이콘(icons.js)
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 서아가 처음부터 쓰는 기본 모션 (관계로 얻는 것 · 무료)
const BASE={m01:"웃음",m02:"고개 끄덕이기",m03:"놀라기",m04:"한숨 쉬기",m05:"시선 피하기",m06:"허둥대기",m07:"팔짱 끼기",m11:"손 내밀기",m12:"다가가기",m18:"감싸 안기"};
const MNAME={...BASE};  // 나머지 몸짓 이름은 data/motions.json 에서 채움
const IDLE="m25";               // 답장을 기다릴 때 · 고를 몸짓이 없을 때 (data/motions.json idle)

// ── 데이터 파일 (data/*.json) ──
const DATA={config:{},face:{map:[],default:"soft"},motions:{motions:{},faceEmotion:{}},keywords:{keywords:[]}};
// 51: 배포 버전(tools/version.mjs 가 index.html meta 와 data/version.json 을 같이 바꿈). 화면과 데이터 버전이 다르면(옛 index 가 캐시에 남음) 한 번만 새로고침
const APP_V=(document.querySelector('meta[name="moti-version"]')||{}).content||"";
async function checkVersion(){let v=null;
  try{const r=await fetch("data/version.json?t="+Date.now(),{cache:"no-store"});if(r.ok)v=(await r.json()).v}catch(e){}
  if(!v||v===APP_V)return;
  const k="moti_vreload";let done=null;try{done=sessionStorage.getItem(k)}catch(e){}
  if(done===v||new URLSearchParams(location.search).get("v")===v){console.warn("버전이 달라 한 번 새로고침했지만 그대로",APP_V,"→",v);return}  // 두 번은 안 함(저장소가 막힌 브라우저는 주소의 v 로)
  try{sessionStorage.setItem(k,v)}catch(e){}
  const u=new URL(location.href);u.searchParams.set("v",v);location.replace(u.href);await new Promise(()=>{})}  // 주소가 달라져 새 index 를 받음
async function loadData(){
  await checkVersion();
  const get=p=>fetch(p+(APP_V?"?v="+encodeURIComponent(APP_V):""),{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null);
  const [c,f,m,st,it,kw,lk,dm,dsc,ui,ob,chs,eps,gf,col,ph,sp,pk,rw,en]=await Promise.all([get("data/config.json"),get("data/emotion_face.json"),get("data/motions.json"),get("data/seoa_story.json"),get("data/seoa_intro.json"),get("data/motion_keywords.json"),get("data/look.json"),get("data/demo.json"),get("data/demo_scenes.json"),get("data/ui.json"),get("data/onboarding.json"),get("data/characters.json"),get("data/episodes.json"),get("data/gifts.json"),get("data/collection.json"),get("data/photos.json"),get("data/seoa_photo.json"),get("data/pack.json"),get("data/rewind.json"),get("data/endings.json")]);
  if(pk&&pk.price)DATA.pack=pk;  // 49 카드 팩
  DATA.rewind=rw||{};  // 51 실패 엔딩 · 되감기
  DATA.endings=en||{};  // 54 엔딩 기록 · 성공 엔딩
  DATA.photos=ph||{};DATA.seoaPhoto=sp||{};
  if(gf&&gf.list){GIFT=gf;GIFTS=gf.list}if(col&&col.items){COL=col;COL.held=COL.items.filter(x=>x.hold);COL.items=COL.items.filter(x=>!x.hold)}  // 44: 보류 칸(hold)은 앱 어디에도 안 나오고 세지 않음(저장값 S.col 은 그대로)
  if(chs&&chs.list)CH=chs.list;REC=(chs&&chs.recommend)||CH.map(x=>x.id);if(eps)EPS=eps;STORIES=EPS.special||[];
  DATA.look=lk;DATA.demo=dm||{};DATA.scenes=dsc||{scenes:[]};DATA.ui=ui||{};DATA.onboarding=ob||{};
  if(c)DATA.config=c;if(f)DATA.face=f;if(m)DATA.motions=m;if(kw)DATA.keywords=kw;DATA.story=st;DATA.intro=it;
  if(st&&st.locations&&st.locations.length)SCENES=st.locations;
  for(const id in DATA.motions.motions)if(!MNAME[id])MNAME[id]=DATA.motions.motions[id].name;
  for(const id in DATA.motions.xstage||{}){const x=DATA.motions.xstage[id];if(id[0]!=="_"&&x&&x.file)XS[id]={url:x.file,from:+x.from||0,to:x.to!=null?+x.to:null,inPlace:!!x.inPlace,skip:Array.isArray(x.skip)?[+x.skip[0],+x.skip[1]]:null,repeat:Math.max(1,Math.round(+x.repeat||1)),fadeIn:+x.fadeIn||0,fadeOut:+x.fadeOut||0,turn:+x.turn||0,skipBlend:+x.skipBlend||0,damp:x.damp&&typeof x.damp==="object"?x.damp:null,ver:+x.motionVer||1,face:x.face||null,faceEmo:x.faceEmo||"",faceAt:+x.faceAt||0,tiltMax:x.tiltMax&&typeof x.tiltMax==="object"?x.tiltMax:null,frame:x.frame||null,frameMs:+x.frameMs||0,frameBackMs:+x.frameBackMs||0}}
  // 50: ?giftPreview=1(확인용) — 순간 선물 반응 몸짓 id 를 이미 있는 몸짓으로 잠시 대신함(data/gifts.json preview). ver 0.5 = 진짜 모션이 오면 카드 그림을 다시 만들게
  if(qs.get("giftPreview")==="1")for(const id in GIFT.preview||{}){const src=GIFT.preview[id];if(id[0]==="_"||XS[id]||RIG.M[id])continue;
    if(XS[src])XS[id]={...XS[src],ver:.5};else if(RIG.M[src])RIG.M[id]=RIG.M[src];MNAME[id]=(MNAME[src]||src)+" (미리보기)"}
  // 50: 반응 몸짓이 아직 없는 순간 선물 카드(source moment)는 보류 칸처럼 숨김(목록·개수에 안 나옴)
  if(COL.items){const no=COL.items.filter(x=>x.source==="moment"&&!(x.play&&(XS[x.play.m]||RIG.M[x.play.m])));if(no.length){COL.held=[...(COL.held||[]),...no];COL.items=COL.items.filter(x=>!no.includes(x))}}
  if(!c||!f||!m||!st||!it||!kw||!chs||!eps||!gf||!col||!ph||!pk||!rw)console.warn("data/*.json 일부를 불러오지 못함 (file:// 로 열었으면 로컬 서버로 여세요)");
}
// 화면 문구(data/ui.json): UI("album.title"), UI("gift.pity",{n:…}). 없으면 키 이름 그대로
const UI=(k,vars)=>{let v=k.split(".").reduce((o,x)=>o!=null?o[x]:undefined,DATA.ui||{});if(typeof v!=="string")v=k;for(const n in vars||{})v=v.split("{"+n+"}").join(vars[n]);return v};
// 서버 버전: data/config.json → 주소 ?server=2 로 덮어쓰기. 서버 주소: ?api=http://localhost:8000
const qs=(()=>{try{return new URLSearchParams(location.search)}catch(e){return new URLSearchParams()}})();
// 서버 모드: 1 = v1, 2 = v2, 0 = 없음(예시 대사만). 주소 ?server= → 시연 패널에서 고른 값(새로고침해도 유지) → data/config.json
const DEBUG=qs.get("debug")==="1";
const DKEY="moti_demo";  // 시연 패널 자체 설정(서버 모드·패널 열림·지금 장면). 초기화해도 지우지 않음
let DS;try{DS=JSON.parse(localStorage.getItem(DKEY))||{}}catch(e){DS={}}
const saveDS=()=>{try{localStorage.setItem(DKEY,JSON.stringify(DS))}catch(e){}};
const serverMode=()=>{const q=qs.get("server");if(q==="0"||q==="1"||q==="2")return +q;if(DS.server===0||DS.server===1||DS.server===2)return DS.server;return DATA.config.serverVersion===2?2:1};
const serverVer=()=>serverMode()===2?2:1;
const noServer=()=>serverMode()===0;
const apiUrl=()=>(qs.get("api")||DATA.config.apiUrl||"https://seoa-backand.onrender.com").replace(/\/+$/,"");

// 표정: VRoid 표정 데이터(Fcl_…) 조합
// 14-3: 기본·미소·뾰로통·슬픔·수줍음을 눈을 뜬 채 부드럽게(눈을 가늘게 뜨던 표정이 어색해 보여서). 예전 값은 주석
const FACE={
  neutral:{Fcl_MTH_Fun:.3,Fcl_BRW_Fun:.3},                 // 예전 {} — 입꼬리만 살짝 올린 기본 얼굴
  joy:{Fcl_ALL_Joy:1},
  fun:{Fcl_ALL_Fun:.85},
  soft:{Fcl_MTH_Fun:.5,Fcl_BRW_Fun:.45},                   // 예전 {Fcl_ALL_Fun:.45}
  sorrow:{Fcl_BRW_Sorrow:.5,Fcl_EYE_Sorrow:.2,Fcl_MTH_Sorrow:.3},   // 예전 {Fcl_ALL_Sorrow:.85}
  angry:{Fcl_ALL_Angry:.8},
  sulky:{Fcl_BRW_Sorrow:.35,Fcl_MTH_Sorrow:.3,Fcl_MTH_Small:.2},    // 예전 {Fcl_BRW_Angry:.8,Fcl_EYE_Angry:.35,Fcl_MTH_Small:.5}
  surprised:{Fcl_ALL_Surprised:1},
  shy:{Fcl_BRW_Sorrow:.45,Fcl_MTH_Fun:.35,Fcl_EYE_Fun:.2}          // 예전 {Fcl_EYE_Joy:.55,Fcl_BRW_Sorrow:.55,Fcl_MTH_Small:.6}
};
const FACEKO={neutral:"무표정",joy:"활짝 웃음",fun:"웃음",soft:"살짝 미소",sorrow:"슬픔",angry:"화남",sulky:"뾰로통",surprised:"놀람",shy:"수줍음"};

const STATES={normal:{ko:"평소",e:"😐"},tired:{ko:"지침",e:"😮‍💨"},sulky:{ko:"삐짐",e:"😤"},birthday:{ko:"생일",e:"🎂"}};
const SORDER=["normal","tired","sulky","birthday"];

// 선물 4종(data/gifts.json, 9-A). 49: 뽑기 없이 건네기만(give)
let GIFT={list:[]},GIFTS=[];
// 명장면 수집(몸짓 도감, data/collection.json): 대화 몸짓 + 선물 몸짓 g01~g12. 기록은 S.col[id] = {at, line, scene, text?, char, outfit, thread, stage}
// 26-1 무빙 카드: 처음 본 순간의 캐릭터·의상·이야기 줄기(main 또는 에피소드 id)·관계 단계를 같이 남기고(seenNow), 카드 그림은 cards.js 가 따로 저장
let COL={items:[],grades:{},notify:{},gradeOrder:["common","rare","special"]};
const colBy=id=>COL.items.find(x=>x.id===id);
// 27: 장소와 의상은 세트. 에피소드 전용 장소(크리스마스 거리·드라큘라의 성 등)면 그 에피소드 의상, 아니면 지금 의상
// (에피소드 장소인데 다른 옷, 에피소드 옷인데 다른 장소로 저장되던 것 막기)
function outfitForScene(sc,cur){const inEp=x=>x.scene===sc||(x.places||[]).includes(sc);
  if(typeof Thread!=="undefined"&&Thread.ep()&&sc===S.scene&&inEp(Thread.ep()))return Outfit.want();  // 42: 지금 에피소드의 지금 장소면 지금 옷(자취방이어도 갈아입기 전이면 니트)
  const ep=STORIES.find(x=>inEp(x)&&x.outfit&&SCENES[sc]&&SCENES[sc].episode);if(ep)return (ep.outfitByScene||{})[sc]||ep.outfit;  // 40: 장소별 의상
  const fits=k=>STORIES.some(x=>inEp(x)&&(x.outfit===k||Object.values(x.outfitByScene||{}).includes(k)));
  const epKeys=new Set(STORIES.flatMap(x=>[x.outfit,...Object.values(x.outfitByScene||{})]).filter(Boolean));if(cur&&epKeys.has(cur)&&!fits(cur))return "ops";return cur||"ops"}
const seenNow=(o={})=>({at:Date.now(),scene:S.scene,char:"seoa",outfit:outfitForScene(S.scene,Outfit.want()),thread:Thread.cur(),stage:curStage(),...o});
const gBy=id=>GIFTS.find(g=>g.id===id);
// 50: 지금 줄 수 있는 선물(언제든 선물, 또는 지금 열린 순간 선물)
const giftable=g=>!!g&&(g.kind!=="moment"||(typeof Moment!=="undefined"&&Moment.isOpen(g.id)));
// 캐릭터 목록은 data/characters.json(8-A). loadData 가 채운다. REC = 추천 탭 순서
let CH=[],REC=[];
const chBy=id=>CH.find(c=>c.id===id);
// 연령 등급(7-C): ageRating 이 있는 캐릭터(서도윤 19)는 홈 카드 배지를 원고 문구(data/onboarding.json adult.badge)로, 인증 전에는 대화방 대신 인증 시트
const needAdult=cid=>{const c=chBy(cid);return !!(c&&c.ageRating>=19&&!S.adult)};
const badgeOf=c=>c.ageRating>=19?(Onboard.T("adult.badge")||c.ageRating+"+"):c.badge;
// 서아 장소 5곳 (data/seoa_story.json locations, 서버 location 값과 1:1). 못 불러오면 배경 하나로 버팀
let SCENES=[{name:"",img:"bg_seoa_street.jpg"}];

// ───────────────────────── 상태 (이 브라우저에만 저장) ─────────────────────────
const KEY="moti_gift_proto_v2";
// story: 서아 이야기 상태(서버 v2와 주고받음) · col: 명장면 수집 기록(9단계, 예전 firsts) · packPity: 카드 팩 천장 남은 장 수(49, 예전 pity = 선물 천장) · packNext: 시연 패널 다음 카드 팩 결과 · unlocked: 판정·사건으로 열린 몸짓 · introDone: 인트로를 봤는지
// rooms: 대화 목록에 보이는 대화방(6-C). 처음엔 비어 있고, 캐릭터 대화방에 들어가면(홈 카드 등) 생긴다
const blank=()=>({v:5,bond:0,stories:{},plus:false,dia:500,chats:{},read:{},room:null,rooms:[],mood:"normal",birthday:false,force:null,scene:0,story:{},col:{},packPity:null,packNext:null,unlocked:[],introDone:false});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
// 예전 저장값 옮기기: 장소 2곳(0 네온 거리, 1 도시 옥상) → 5곳(2 네온 골목, 4 바 옥상). 이미 대화하던 사람은 인트로를 건너뜀
if(!S.v){const mv=i=>i===1?4:2;S.scene=mv(S.scene||0);
  S.story=S.story||{};S.unlocked=S.unlocked||[];S.introDone=true;S.v=2}
// 9단계: 예전 선물 리액션(album 16칸)·선물로 배운 몸짓(learned)은 옮기지 않고 버림. 명장면 기록(firsts)은 도감 기록(col)으로 합침
if(S.v<3){S.col={};(S.firsts||[]).forEach(f=>{if(f&&f.mid&&!S.col[f.mid])S.col[f.mid]={at:f.at,line:f.line||"",text:f.text||"",scene:f.scene}});
  delete S.album;delete S.learned;delete S.firsts;S.pity=null;S.giftNext=null;S.v=3}
S.col=S.col||{};
// 49: 선물 뽑기 → 카드 팩. 선물로 모은 카드(S.col.g01…)는 id 가 그대로라 그대로 가진 것으로 남음(카드 팩 탭에 보임). 선물 천장·다음 선물 결과는 버리고 카드 팩 천장은 새로 시작
if(S.v<4){delete S.pity;delete S.giftNext;S.packPity=null;S.packNext=null;S.v=4}
// 50-1: 50 의 순간 카드 gm01~gm03(칵테일 · 차가움/흔들림/솔직함, 확인용으로만 생길 수 있던 카드)을 지움. 같은 id 를 새 카드가 쓰므로 카드 그림도 지움(Cards.init 뒤)
if(S.v<5){const old=["gm01","gm02","gm03"].filter(id=>S.col&&S.col[id]);old.forEach(id=>delete S.col[id]);if(old.length)S.dropCards=old;S.v=5}
delete S.camHelp;delete S.roomAt;  // 24-2: 카메라 도움말·홈 「이어서 대화」를 빼면서 쓰지 않게 된 저장값

// ───────────────────────── 첫 만남 연출(31) ─────────────────────────
// 서아 기본 에피소드 「라스트 오더」를 처음 시작할 때 한 번(저장값 S.firstMeet, 전체 초기화로 지워짐). 「이어하기」·특별 에피소드·두 번째부터는 없음.

// 끝까지 보거나 건너뛰면 무빙 카드 시크릿 「첫 만남」(data/collection.json 의 firstMeet 칸). 값 data/config.json firstMeet, 문구 data/ui.json firstMeet
const FirstMeet=(()=>{
  const info={};let preloaded=false;
  // 31-1: 처음 시작이라 연출이 나올 예정이면(firstMeet·오프닝 전) 온보딩이 떠 있는 동안 연출 장소의 360도 그림을 미리 받아 둠(텍스처만, 구는 연출 때 만듦)

  let armed=false,on=false,pend=false,tok=0,T=[],el=null,then=null,replay=false,back=null,pinned=-1,endPin=-1;
  const C=()=>(DATA.config&&DATA.config.firstMeet)||{};

  // 37: 자막 한 줄. *…* = 지문(기울임), 그 밖 = 대사. 없으면 지움

    if(el){el.shade.classList.remove("on");el.veil.classList.remove("on");el.top.classList.remove("on");el.bot.classList.remove("on");el.skip.classList.remove("on");el.cap.classList.remove("on")}}

  async function run(o={}){

    // ① 어두워짐 + 전체 화면 + 띠

    void el.shade.offsetWidth;el.shade.classList.add("on");el.veil.classList.add("on");grow(fm);bars(true,fm);el.skip.classList.add("on");

    // ② 연출 장소(37: 비 내리는 골목), 넓은 구도. 장면(beats)마다 몸짓 + 자막(data/seoa_intro.json prologue.lines[line]) + 카메라 yawTo
    showScene(c.scene);Stage.pano.show(c.scene,0);Stage.play(IDLE,{quiet:true,blendMs:0});Stage.frameTo(frame(c.yawFrom||0),0);

// ───────────────────────── 화면 확대·카메라 다가가기 규칙 (17-1A) ─────────────────────────
// 종류(kind): "stage" 관계 단계 상승 대표 몸짓 = 늘 확대(쿨다운을 다시 셈) · "zoom" 선물 반응·레어/시크릿 처음 = 확대, 쿨다운 안이면 카메라만
// "push" 일반 몸짓 처음·결정적 순간 = 카메라만 · "view" 앨범 다시 보기·시연 패널 몸짓 = 쿨다운과 상관없이 확대(쿨다운도 안 셈) · "" 그대로
// 쿨다운: 내 메시지 수(turn) 기준 zoomCooldownTurns(5) 턴에 한 번. 값 data/config.json stage. 기록은 저장값 S.fx(전체 초기화로 비움)
const Fx={
  st(){return S.fx||(S.fx={turn:0,zoomAt:null,keyAt:null,once:{},emo:"",keyForce:false,keyNext:null,last:null})},
  C:()=>(DATA.config&&DATA.config.stage)||{},
  log:[],  // 확인용: 연출이 정해질 때마다 {turn, kind, fx, mid}
  tick(){this.st().turn++;save()},
  zoomLeft(){const f=this.st(),cd=this.C().zoomCooldownTurns!=null?this.C().zoomCooldownTurns:5;return f.zoomAt==null?0:Math.max(0,cd-(f.turn-f.zoomAt))},
  pick(kind,mid){const f=this.st();let fx="";
    if(kind==="stage"){f.zoomAt=f.turn;fx="big"}
    else if(kind==="zoom"){if(!this.zoomLeft()){f.zoomAt=f.turn;fx="big"}else fx="push"}
    else if(kind==="view")fx="big";
    else if(kind==="push")fx="push";
    if(kind){this.log.push({turn:f.turn,kind,fx,mid:mid||null});if(this.log.length>80)this.log.shift();save()}
    return fx},
  // 처음 보는 대화 몸짓이면 등급에 맞는 종류(레어·시크릿 = zoom, 일반 = push), 아니면 ""
  first(mid){const it=mid&&colBy(mid);if(!it||it.source!=="chat"||S.col[mid])return "";return it.grade==="common"?"push":"zoom"},

const Place=(()=>{
  let tok=0;const info={};
  const C=()=>(DATA.config&&DATA.config.placeFade)||{};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const within=(p,ms)=>Promise.race([Promise.resolve(p).catch(()=>null),sleep(ms)]);
  const vis=()=>{const s=$("#stage");if(!s||s.style.display==="none"||Stage.isLent()||FirstMeet.isOn())return false;const r=s.getBoundingClientRect();return r.width>40&&r.height>40};
  const busyNow=()=>{const p=Stage.playing();return !!(p&&p!==IDLE)||Math.abs(Stage.follow())>.005||View.isBig()||View.isPushed()||View.moving()>0};

    if(!v){v=document.createElement("div");v.className="plveil";const cv=st.querySelector("canvas");(cv||$("#bgdim")).after(v)}
    if(C().color)v.style.background=C().color;return v}
  function off(){const v=$("#stage .plveil");if(v){v.style.transitionDuration="0ms";v.classList.remove("on")}}
  const imgWait=src=>new Promise(r=>{const i=new Image();i.onload=i.onerror=()=>r(true);i.src=src;if(i.complete)r(true)});
  // 새 장소로 바로(평평한 그림의 .6초 전환·구의 fadeMs 전환 없이 — 어두운 막 뒤라서)

    info.busyMs=Math.round(performance.now()-t0);

  function cancel(){tok++;off()}
  return{go,cancel,info};

  catch(e){const to=e&&e.name==="AbortError";console.warn(to?"서버 답장 시간 초과 → 예시 대사":"서버에 연결 못 함 → 예시 대사",path,e&&e.name);rec({error:to?"timeout":"error"});return null}finally{clearTimeout(tm)}

// 29: v2 로 처음 열 때 저장값 옮기기(한 번만, S.v2moved). 단계 n 은 그대로 두고 호감도를 맞춤
// 29-1: 대화 횟수의 단계 안 진행 비율(countAt[n-1]~countAt[n])을 호감도 affectionAt[n-1]~affectionAt[n] 의 같은 비율로 → 게이지 막대 길이가 같게(정수로 반올림)

const oneLine=t=>String(t||"").replace(/\s*[\r\n]+\s*/g," ").trim();

// 50: 순간 선물. 서버 답장 gift_moment({id, reason}) 또는 임시 규칙(data/gifts.json momentFallback)으로 한 번에 하나 열림.
// 저장값 S.moment = {id, reason, left(남은 내 메시지 수), src}. 열린 뒤 내 메시지 moment.turns 번이 지나면 닫힘. S.momentSrv = 서버가 gift_moment 를 한 번이라도 보냄(임시 규칙 꺼짐)
// S.momentLast[id] = 닫힌 때의 내 메시지 수(S.turnN) — 임시 규칙은 cooldownTurns 동안 같은 선물을 다시 안 엶
const Moment={
  cfg(){return GIFT.moment||{}},
  // 50-1: 순간 선물마다 반응 몸짓 하나(reaction)·카드 한 장. 관계 단계 하나에 선물 하나(stage)
  reactionOf(g){const m=g&&g.reaction;return m&&canPlay(m)?m:null},
  cardOf(g){return g&&COL.items.find(x=>x.source==="moment"&&x.gift===g.id)||null},
  stageOk(g){return !!g&&curStage()>=(+g.stage||1)},  // 본 이야기 관계 단계 ≥ 그 선물의 단계
  ready(g){return !!(g&&g.kind==="moment"&&!Thread.ep()&&this.stageOk(g)&&this.reactionOf(g))},  // 특별 에피소드에서는 늘 닫힘
  // 서버에 보내는 「지금 열 수 있는 순간 선물」: 단계·반응 몸짓을 앱이 거른 것만. 하나가 열려 있으면 비움(한 번에 하나)
  // 90: 닫힌(안 줬거나 준) 순간 선물은 내 메시지 cooldownTurns 번 동안 목록에서 뺌(서버는 「준」 선물만 셈 — story-routes 보고서 앱 팀 6)
  cooled(g){const cd=Math.max(0,+this.cfg().cooldownTurns||0),L=S.momentLast||{};return L[g.id]!=null&&(S.turnN||0)-L[g.id]<cd},
  list(){if(S.moment)return[];return GIFTS.filter(g=>this.ready(g)&&!this.cooled(g)).map(g=>({id:g.id,name:g.name,when:g.when||""}))},
  open(){return S.moment&&gBy(S.moment.id)?S.moment:null},
  isOpen(id){const o=this.open();return !!(o&&o.id===id&&this.ready(gBy(id)))},
  start(id,reason,src){const g=gBy(id);if(S.moment||!this.ready(g))return false;
    S.moment={id,reason:reason||"",left:Math.max(1,Math.round(+this.cfg().turns||3)),src:src||"server",at:Date.now()};save();this.glow();return true},
  close(why){if(!S.moment)return;(S.momentLast||(S.momentLast={}))[S.moment.id]=S.turnN||0;S.moment=null;save();this.glow()},
  // 내 메시지를 보낼 때(서아 방): 열려 있으면 남은 수 하나 줄이고 0이면 닫음
  tick(){S.turnN=(S.turnN||0)+1;if(!S.moment)return;S.moment.left=(S.moment.left||1)-1;if(S.moment.left<=0)this.close("turns");else save()},
  // 서아 답장 뒤: 서버 gift_moment → 열기(임시 규칙 끔). 아니면 임시 규칙(켜져 있고 서버가 아직 안 보냈을 때)
  afterReply(v){
    const gm=v&&v.src==="server"&&v.giftMoment;
    if(gm&&typeof gm==="object"){if(!S.momentSrv){S.momentSrv=true;save()}
      if(gm.id&&this.list().some(x=>x.id===gm.id))this.start(gm.id,typeof gm.reason==="string"?gm.reason:"","server");return}
    const F=GIFT.momentFallback||{};if(!F.on||S.momentSrv||S.moment)return;
    const txt=[v.emotion,v.action,v.line].filter(Boolean).join(" "),cd=Math.max(0,+this.cfg().cooldownTurns||0),L=S.momentLast||{};
    for(const r of F.rules||[]){const g=gBy(r.gift);if(!g||!this.ready(g))continue;
      if(this.cooled(g))continue;
      try{if(new RegExp(r.words).test(txt)){this.start(g.id,r.reason,"fallback");return}}catch(e){}}
  },
  // ＋ 버튼 금빛 + 작은 점(서아 방에서만), 기능판 「선물하기」 칸도
  glow(){const on=!!this.open()&&(S.room||"seoa")==="seoa",b=$("#fnBtn"),t=document.querySelector('#fnPanel [data-fn="gift"]');

      Object.assign(story(),{recent_lines:[],summary:"",pending_event:null,stage_flags:[]});S.judgeBuf=[];S.judgeKeep=null;S.judgeN=0;  // 29: 장면을 옮기면 판정 못 한 턴도 비움
      Demo.setStage(sc.stage||1);
      const pi=SCENES.findIndex(x=>x.name===sc.place);setScene(pi>=0?pi:0);
      const md=sc.mood||"normal";S.force=null;S.birthday=md==="birthday";S.mood=md==="birthday"?"normal":md;

      const drop=new Set();for(let k=(sc.stage||1)+1;k<=6;k++)(((DATA.story||{}).unlock||{stage:{}}).stage[k]||{motions:[]}).motions.forEach(id=>drop.add(id));
      if(sc.next&&sc.next.event)evMotions(sc.next.event).forEach(id=>drop.add(id));
      drop.forEach(id=>delete S.col[id]);Cards.remove("seoa",[...drop]);S.unlocked=S.unlocked.filter(id=>!drop.has(id));
      S.demoNext=sc.next||null;
      SeoaPhoto.sceneReset(sc.stage||1);  // 12: 예약된 단계 상승 때 단계 사진이 다시 오게
      S.placeLock=!!sc.place;  // 이 장면 동안 장소는 장면 설정·서버 location 으로만 바뀜. 다른 장면(①·⑥)·전체 초기화에서 풀림
      Stage.setFace("neutral");setTab("chat");openRoom("seoa");
    }
    Demo.refresh();Demo.reveal();chapter(sc);
  }
  // 예약 실행. 돌려주는 값 = 이 턴에 고정할 단계
  function runReserve(R){
    const q=[],st=story(),D=DATA.story||{};
    if(R.stage&&R.stage>curStage()){const from=curStage();st.stage=R.stage;
      S.bond=Math.max(S.bond||0,(D.countAt||[])[R.stage-1]||0);st.affection=Math.max(st.affection||0,(D.affectionAt||[])[R.stage-1]||0);stageUp(from,R.stage,q)}
    if(R.event){const ev=D.unlock&&D.unlock.event[R.event];if(ev)q.push(ev)}
    save();unlockShow(q);Demo.render();return curStage();
  }
  const resText=R=>!R?"":R.stage?T("reserveStage",{name:stageName(R.stage)}):R.event?T("reserveEvent",{name:evMotions(R.event).map(id=>MNAME[id]||id).join(", ")||R.event}):"";
  function html(T,B){
    const list=L();if(!list.length)return "";
    const c=cur(),now=list[c-1],nx=list[c];
    return `<div class="now">${esc(T("now"))} <b>${now?esc(now.n+" "+now.name):esc(T("none"))}</b> · ${esc(T("next"))} ${nx?esc(nx.n+" "+nx.name):esc(T("none"))}${S.demoNext?`<br><span class="rs">${esc(T("reserved"))} · ${esc(resText(S.demoNext))}</span>`:""}</div>
      <h4>${esc(T("sec.scenes"))}</h4><div class="row">${B("scene0",esc("0 "+Demo.OT("demo.scene0")))}${list.map(sc=>B("scene",esc(sc.n+" "+sc.name),{v:sc.n,on:c===sc.n})).join("")}</div>`;
  }
  function click(a,v){if(a==="scene"){go(+v);return true}return false}
  // 단축키: ?debug=1 일 때만, 입력창에 글자를 치는 중에는 무시
  function onKey(e){
    if(!DEBUG||e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
    const t=e.target;if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
    const c=e.code,n=L().length;let m;
    if(c==="Digit0"||c==="Numpad0")Demo.firstOpen();  // 장면 0 앱 처음 열기(7-A)
    else if((m=/^(Digit|Numpad)([1-9])$/.exec(c))&&+m[2]<=n)go(+m[2]);
    else if(c==="ArrowRight")go(Math.min(n,cur()+1));
    else if(c==="ArrowLeft")go(Math.max(1,cur()-1));
    else if(c==="KeyR")go(cur()||1);
    else if(c==="KeyD")Demo.toggle();
    else if(c==="KeyW")wakeServer();
    else return;
    e.preventDefault();
  }
  document.addEventListener("keydown",onKey);
  return{html,click,go,runReserve,cur};
})();

// ───────────────────────── 관계 (대화로만 오름) ─────────────────────────
// 단계는 story().stage (서버 v2 판정 또는 대화 횟수). 게이지: v2는 호감도, 아니면 대화 횟수 기준
function renderBond(){
  Outfit.sync();  // 관계 단계가 바뀌면 의상도(14)
  const {n,pct}=typeof EpStage!=="undefined"&&EpStage.on()?EpStage.bond():bondNow();  // 28: 계산은 bondNow 로 옮김(마이 「관계」 줄과 같은 값) · 42: 에피소드 단계가 있는 에피소드 안에서는 에피소드 단계
  BondTop.draw(n,pct);return{i:n-1,pct}}
// 19: 대화 화면 오른쪽 위 「{n}단계 · {이름}」 + 얇은 게이지. 단계가 오르면 색이 바뀌며 0에서 새 값까지 다시 참.
// 평소 답장으로 늘 때는 조용히 늘기만. 결정적 순간(17-1B)엔 shine() 으로 밝은 띠가 한 번 지나감. 값 data/config.json bondTop
const bondColor=n=>(((DATA.config||{}).bondTop||{}).colors||{})[n]||"#B4B2A9";  // 21: 단계 색(하트·게이지 같이)
const BondTop=(()=>{
  let last=null;
  const C=()=>(DATA.config&&DATA.config.bondTop)||{};
  function draw(n,pct){
    const c=C(),g=$("#bGauge"),f=g.firstElementChild,col=(c.colors||{})[n]||"#B4B2A9";
    $("#bondTxt").textContent=UI("top.bond",{n,name:stageName(n)});
    const h=$("#bondHeart");if(!last||last.n!==n){h.innerHTML=Icon.heart(n,20);h.setAttribute("role","img");h.setAttribute("aria-label",UI("top.bondAria",{n}))}
    h.style.setProperty("--hc",(last?(c.colorMs||600):0)+"ms");h.style.color=col;  // 21: 하트 선·숫자 = 게이지 색, 같은 colorMs 로 바뀜
    g.style.setProperty("--gh",(c.gaugeH||4)+"px");if(c.track)g.style.setProperty("--gt",c.track);
    const up=last&&n>last.n,same=last&&n===last.n&&last.pct===pct&&last.col===col;
    if(same)return;
    if(up){  // 단계 상승: 색은 colorMs, 게이지는 0 → 새 값 fillMs
      f.style.transition="none";f.style.width="0%";void f.offsetWidth;
      f.style.transition=`width ${c.fillMs||600}ms ease-out, background-color ${c.colorMs||600}ms ease`;
    }else if(last)f.style.transition=`width ${c.growMs||500}ms ease-out, background-color ${c.colorMs||600}ms ease`;
    else f.style.transition="none";
    f.style.backgroundColor=col;f.style.width=pct+"%";
    last={n,pct,col}}
  let anim=null;
  function shine(){
    const s=C().shine||{},e=$("#bGauge").lastElementChild;
    e.style.setProperty("--sw",((s.width||.4)*100)+"%");if(s.color)e.style.setProperty("--sc",s.color);
    if(anim)anim.cancel();
    if(!e.animate)return;
    // 띠 폭(width)만큼 왼쪽 밖에서 시작해 게이지 오른쪽 밖으로. translateX % 는 띠 자기 폭 기준
    const out=100/(s.width||.4);
    anim=e.animate([{transform:"translateX(-100%)",opacity:1},{transform:`translateX(${out}%)`,opacity:1}],{duration:s.ms||800,easing:s.ease||"ease-in-out"});
    anim.onfinish=()=>{anim=null}}
  return{draw,shine,reset(){last=null}};
})();

  setTab("chat");openRoom(st.char||"seoa");

  addMsg("sys",UI("home.storyStart",{name:st.name}),null,"seoa");

const Swipe={

    const up=()=>{if(!drag)return;const w=x.clientWidth,d=x.scrollLeft-drag.s0,j0=Math.round(drag.s0/w),j=Math.max(0,Math.min(L.length-1,j0+(Math.abs(d)>w*.18?Math.sign(d):0)));drag=null;x.style.scrollSnapType="";if(moved)x.scrollTo({left:j*w,behavior:"smooth"})};

const Thread={

  // 42: 줄기에 따로 붙은 값(에피소드 단계 ep)은 그대로 두고 덮어씀. 판정 묶음(judgeBuf·judgeN)도 줄기마다 따로(본 이야기 턴이 에피소드 판정에 섞이지 않게)

    else{S.chats.seoa=[];S.read.seoa=0;if(S.sid)delete S.sid.seoa;st.recent_lines=[];st.summary=""}

// 42: 에피소드만의 관계 단계. data/episodes.json 특별 에피소드의 stage 묶음이 있으면(지금은 s2 크리스마스 이브만) 그 에피소드 안에서는
// 판정 결과(호감 변화·플래그)를 본 이야기 대신 에피소드 호감에만 쌓고, 단계도 앱이 정한다(서버 단계 규칙은 본 이야기 것이라 쓰지 않음).
// 저장: S.threads[에피소드 id].ep = {aff 호감, stage 단계, flags 이 단계에서 받은 판정 플래그, miss 단계를 못 올린 판정 수, signaled 신호를 넣은 단계, dressed 자취방 옷으로 갈아입었는지, play 진행 중인 단계 장면}
// 단계 이름은 본 이야기와 같음(data/seoa_story.json stageNames). 화면 위 하트·게이지는 에피소드 안에서 에피소드 단계
const EpStage={
  cfgOf:e=>e&&e.stage&&Array.isArray(e.stage.affectionAt)?e.stage:null,
  cfg(){return this.cfgOf(Thread.ep())},
  on(){return !!this.cfg()},
  st(){const e=Thread.ep();if(!this.cfgOf(e))return null;const T=S.threads||(S.threads={}),t=T[e.id]||(T[e.id]={});
    const s=t.ep||(t.ep={aff:0,stage:1,flags:[],miss:0,signaled:[],dressed:false,play:null,turns:0});return s},
  n(){const s=this.st();return s?Math.max(1,Math.min(6,s.stage||1)):curStage()},
  name(){return stageName(this.n())},
  // 하트·게이지 값(bondNow 와 같은 계산, 에피소드 기준)
  bond(){const A=this.cfg().affectionAt,s=this.st(),i=this.n()-1;

  // 다음 단계로 가는 데 필요한 판정 플래그(하나라도). 없으면 호감만
  flagsOk(to,flags){const need=(this.cfg().needFlags||{})[to];return !need||!need.length||need.some(f=>flags.includes(f))},
  // 이 장소에 갈 수 있는지(placeFrom: 장소 → 열리는 단계)
  placeOk(i){const C=this.cfg();if(!C)return true;const from=(C.placeFrom||{})[i];return from==null||this.n()>=from},
  // 판정 한 번: 호감 delta·플래그 flags 를 에피소드에만 더함. 한 번에 한 단계까지(건너뛰지 않게). 단계 상한 = cap(다음 기준 − 1)
  apply(delta,flags){const s=this.st(),A=this.cfg().affectionAt;if(!s)return null;
    (flags||[]).forEach(f=>{if(!s.flags.includes(f))s.flags.push(f)});

    else if(typeof EpScene!=="undefined")EpScene.maybeSignal();

  // 서버 v1·서버 없음: 판정 대신 judgeEvery 턴마다 noServerGain 만큼(플래그 없음)
  turn(){const s=this.st();if(!s)return;s.turns=(s.turns||0)+1;save();if(s.turns%judgeEvery()===0)this.judged(this.cfg().noServerGain||0,[])},
  // /judge 에 보낼 상태: 본 이야기 상태를 바탕으로 단계·호감·플래그만 에피소드 값(본 이야기 사건·출발 일수는 빼고)
  judgeState(){const s=this.st();return{...chatState(),stage:this.n(),affection:s.aff||0,stage_flags:(s.flags||[]).slice(),pending_event:null,departure_days_left:null,ending:null}},  // 42-C: episode 신호도 같이
  // 시연 패널: 단계 n 으로(호감 = 그 단계 기준, 플래그·신호 비움). 4단계 이상이면 자취방이 열리고, dressFrom 이상이면 자취방 옷
  // 자취방 옷(outfitByScene)을 입을 때인지: 장면에서 갈아입은 뒤(dressed) 또는 dressFrom 단계부터

};
// 42: 에피소드 단계 장면(data/episodes.json stageScenes). 단계가 오르면 그 단계 장면을 오프닝처럼 문단 간격을 두고 보여 주고, 끝나면 자유 대화.
// 1단계 장면 = 에피소드 시작 장면. 진행 중인 장면은 저장(ep.play = {n 단계, k 다음에 보일 문단, pend 끝나기 전 끊긴 문단의 걷기})해서 다시 들어오면 그 자리부터 이어 감.

const EpScene=(()=>{
  let tok=0,running=false,queue=[];

  const cfgOf=n=>{const e=Thread.ep();return e&&e.stageScenes&&e.stageScenes[n]||null};
  const W=()=>(DATA.config&&DATA.config.walk)||{};
  const vis=()=>{const st=$("#stage");return S.room==="seoa"&&curTab==="chat"&&!Cam.isOpen()&&!Stage.isLent()&&st&&st.style.display!=="none"&&st.getBoundingClientRect().height>40};
  // 몸짓(배열이면 앞 몸짓이 거의 끝날 때 다음 몸짓)
  function motion(m,alive){const L=Array.isArray(m)?m:[m];let at=0;

  function cancel(why){photoAt=0;if(!plan)return;clear();if(plan.framed)Stage.frameTo("normal");if(why)log.push({at:Math.round(performance.now()),cancel:why});plan=null;SeoaPhoto.kick(0)}
  // 대화 탭으로 올 때와 openRoom 이 한 번에 두 번 불릴 수 있음(setTab → openRoom) → 이미 잡힌 인사는 그대로 둠
  function enter(){if(plan)return;const w=why();log.push({at:Math.round(performance.now()),enter:w||"greet"});if(log.length>20)log.shift();if(w)return;
    plan={t0:performance.now(),mid:pick()};later(tick,C().startDelayMs!=null?C().startDelayMs:100)}  // 부재중 사진 자리가 먼저 잡히게(openRoom 의 SeoaPhoto.enter 뒤에 첫 확인)
  function tick(){if(!plan||plan.on)return;
    if(!inRoom())return cancel("room");
    const h=hold(),c=C();
    if(h){if(performance.now()-plan.t0>(c.waitMaxMs!=null?c.waitMaxMs:10000))return cancel("wait:"+h);return later(tick,100)}
    play()}
  function play(){const c=C(),mid=plan.mid,F=(c.frame||{})[mid],L=c.lineDelayMs,ld=L&&typeof L==="object"?L[mid]:L,dur=Stage.dur(mid)*1000;
    plan.on=true;plan.at=performance.now();
    Stage.play(mid,{quiet:true});Stage.setFace((c.face||{})[mid]||"joy");
    if(F){Stage.frameTo(F,c.frameMs);plan.framed=true}
    const g=gs();g.last=mid;g.at=Date.now();save();
    log.push({at:Math.round(plan.at),play:mid});
    later(say,ld!=null?ld:Math.max(0,dur-400));  // 첫 대사(34-1)
    later(()=>{if(!plan)return;if(plan.framed)Stage.frameTo("normal",c.frameMs);if(!Stage.recentMotion(0))Stage.setFace(curState()==="sulky"?"sulky":curState()==="tired"?"sorrow":"soft");plan=null},dur+200)}
  return{enter,cancel,why,
    holds:()=>(!!plan&&!plan.line)||performance.now()<photoAt,  // 서아 사진(부재중 사진 빼고)을 첫 대사 뒤 photoAfterMs 까지 미룸(34-1: 한 줄 → 사진)
    pending:()=>!!plan,             // 인사를 기다리거나 하는 중(시계 보기 타이머가 세지 않음)
    info:()=>({why:why(),plan:plan&&{...plan},last:gs().last||null,lastAt:gs().at||null,hours:hours(),lastTalk:lastTalk(),log:log.slice()})};
})();
function start(){
  if(!S.chats.seoa||!S.chats.seoa.length){
    // 인트로 원고(data/seoa_intro.json)가 있으면 처음 들어갈 때 대화방 안에서 문단별로 보여 줌. 없으면 예전 한 줄 인트로
    S.chats.seoa=[{r:"sys",t:UI("chat.seoaFirst")},...(DATA.intro&&!S.introDone?[]:[{r:"c",t:chBy("seoa").intro,at:Date.now()-(chBy("seoa").firstMin||7)*60000}])];
  }
  if(!S.story.stage)S.story.stage=1;
  if(!S.story.location&&SCENES[S.scene||0])S.story.location=SCENES[S.scene||0].name;
  CH.forEach(c=>chatOf(c.id));
}
const dataReady=loadData();
// 온보딩(7-A): 처음 실행일 때만(저장값 onboarded 가 없을 때). 데이터를 기다리지 않고 바로 덮어서 홈이 먼저 비치지 않게. ?skipintro=1 이면 건너뜀(개발용)
const SKIP_INTRO=qs.get("skipintro")==="1";
if(!S.onboarded&&!SKIP_INTRO){Onboard.open();
  // 39: 온보딩 아래 비치는 홈(캐릭터 사진·특별 에피소드 그림)은 서아 3D 모델을 다 받은 뒤에 그림 받기 시작(첫 화면·입장권에 필요한 모델과 겹쳐 받지 않게)
  $(".app").classList.add("homehold");Stage.ready.then(()=>$(".app").classList.remove("homehold"))}
if(FilmShot.on)FilmShot.start();  // 개발용 필름 사진 만들기(7-2, film.js)
// 배경 밝기·채도(4-2B): data/look.json background. 밝기는 검은 층의 투명도(1−밝기), 채도는 회색 "채도" 섞기 층의 투명도(1−채도)
function applyBg(){const d=$("#bgdim"),b=(DATA.look&&DATA.look.background)||{};if(!d)return;
  if(qs.get("bg")==="raw"||b.on===false){d.classList.add("raw");return}
  d.style.setProperty("--bgDark",String(1-(b.brightness!=null?b.brightness:.8)));d.style.setProperty("--bgDesat",String(1-(b.saturation!=null?b.saturation:.9)))}
dataReady.then(()=>{Stage.frameTo("normal",0);applyBg();wakeServer();start();moveToV2();Route.check("old");End.migrate();Ending.migrate();  // 51-1: 예전 저장값(3단계 이상인데 갈래 없음 → 센 수로 바로 · 5단계인데 되감기 지점 없음 → 지금을 지점으로)renderTop();renderBond();$("#navAlbum").textContent=UI("nav.album");
  document.querySelectorAll("#fnPanel [data-fn]").forEach(b=>b.querySelector("b").textContent=UI("fn."+b.dataset.fn));Fn.set(false);Photos.init();SeoaPhoto.init();Cards.init().then(async()=>{if(S.dropCards){await Cards.remove("seoa",S.dropCards);delete S.dropCards;save()}return Cards.refresh()});Pose.init();renderAlbum();setScene(S.scene||0);setTab("home");Demo.init();pingLater();IdleWatch.init()});  // 시작 화면은 홈(7-A: 온보딩을 마쳤으면 바로 홈)
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
// ＋ 기능판(10-A): ＋ → 입력칸 아래 기능판(＋는 ×로), 입력칸을 누르면 닫힘. 선물하기는 예전 선물 창 그대로
const Fn=(()=>{let on=false;
  function set(v){on=!!v;const p=$("#fnPanel"),b=$("#fnBtn");if(!p)return;p.classList.toggle("on",on);p.setAttribute("aria-hidden",on?"false":"true");
    b.classList.toggle("on",on);b.setAttribute("aria-expanded",on?"true":"false");Moment.glow();b.setAttribute("aria-label",UI(on?"fn.close":"fn.open"));
    if(on){const i=$("#inp");if(document.activeElement===i)i.blur();const L=$("#log");setTimeout(()=>{L.scrollTop=L.scrollHeight},240)}}
  function run(k){set(false);if(k==="gift")giftGuide();else if(k==="camera")Cam.open();else if(k==="pose")Pose.sheet("chat");else if(k==="photo")PhotoUI.sheet()}
  return{set,toggle:()=>set(!on),run,isOn:()=>on}})();
$("#fnBtn").onclick=()=>Fn.toggle();
document.querySelectorAll("#fnPanel [data-fn]").forEach(b=>b.onclick=()=>Fn.run(b.dataset.fn));
$("#inp").addEventListener("pointerdown",()=>Fn.set(false));
$("#backBtn").onclick=showList;
$("#scrim").onclick=closeSheets;
$("#sendBtn").onclick=()=>send($("#inp").value);
// 엔터는 줄바꿈만(기본 동작). 전송은 화살표 버튼으로만
function autoGrow(){const t=$("#inp");t.style.height="auto";const max=parseFloat(getComputedStyle(t).maxHeight)||112;const h=Math.min(t.scrollHeight+2,max);t.style.height=h+"px";t.style.overflowY=t.scrollHeight+2>max?"auto":"hidden"}
$("#inp").addEventListener("input",autoGrow);
// 행동 버튼: 커서 자리에 "()"를 넣고 커서를 괄호 안에. 누를 때 입력창 포커스(키보드)를 잃지 않게 pointerdown 기본 동작을 막음
$("#actBtn").addEventListener("pointerdown",e=>e.preventDefault());
$("#actBtn").onclick=()=>{const t=$("#inp"),a=t.selectionStart??t.value.length,b=t.selectionEnd??a;
  t.focus();t.setRangeText("("+t.value.slice(a,b)+")",a,b,"start");t.setSelectionRange(a+1,a+1+(b-a));autoGrow()};
Stage.init();
$("#inp").addEventListener("focus",()=>{Fn.set(false);if(View.isBig()&&!View.held())View.rest()});  // 42-1: 걷기 확대 중엔 그대로
// 대화 목록이 맨 아래를 보고 있었으면, 3D가 커져 목록이 줄어들어도 맨 아래(최신 말풍선)를 유지
// 91: 예비 지문 아래 「다시 보내기」 — 예비 지문과 방금 내 말을 지우고, 그 턴에 센 수(대화 수·크리스마스 내 메시지 수·확대 턴·순간 선물)를 되돌린 뒤 같은 말을 다시 보냄
function retryLast(){if(busy)return;const room=S.room||"seoa",L=chatOf(room),fb=L[L.length-1];if(!fb||!fb.fb||!fb.retry)return;
  let ui=L.length-2;while(ui>=0&&L[ui].r!=="u")ui--;if(ui<0)return;const text=fb.retry;
  L.splice(ui);  // 내 말 + 그 뒤(예비 지문·장소 안내) 지움
  if(EpStage.on()){const es=EpStage.st();if(es)es.u=Math.max(0,(es.u||0)-1)}else S.bond=Math.max(0,(S.bond||0)-1);
  const f=Fx.st();f.turn=Math.max(0,(f.turn||0)-1);S.turnN=Math.max(0,(S.turnN||0)-1);if(S.moment)S.moment.left=(S.moment.left||0)+1;
  save();renderLog();send(text)}
$("#log").addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(".fbretry");if(b){e.preventDefault();retryLast()}});
let logStick=true;$("#log").addEventListener("scroll",()=>{const L=$("#log");logStick=L.scrollHeight-L.scrollTop-L.clientHeight<40});
if(window.ResizeObserver)new ResizeObserver(()=>{if(logStick){const L=$("#log");L.scrollTop=L.scrollHeight}}).observe($("#log"));
setTimeout(()=>{Stage.setFace(curState()==="sulky"?"sulky":"soft")},1800);
getSample();
</script>
