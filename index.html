<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>moti · 선물과 추억 앨범</title>
<style>
:root{--bg:#0b0a12;--card:#17151f;--line:#2a2635;--text:#f2effa;--sub:#a59fb8;--pri:#8b5cf6;--pri2:#c4b5fd;--gold:#f5c66b;--pink:#f472b6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;background:#050409;color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{width:100%;max-width:440px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;overflow:clip}
header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
header h1{font-size:18px;font-weight:800;flex:none}
/* 다른 캐릭터 알림(6-C): 헤더 안, 로고와 💎 사이 빈자리에 한 줄. 길면 말줄임, 누르면 그 대화방으로 */
.hnote{flex:1;min-width:0;display:flex;justify-content:flex-start}
.hnote button{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600;color:var(--text);background:#211b33;border:1px solid #6d4bd1;border-radius:999px;padding:5px 10px;opacity:0;transform:translateY(-3px);transition:opacity .25s,transform .25s;pointer-events:none}
.hnote button.on{opacity:1;transform:none;pointer-events:auto}
.hnote button b{font-weight:800}
header h1 small{font-size:12px;color:var(--sub);font-weight:500;margin-left:6px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.demo-btn{font-size:12px;color:var(--sub);border:1px dashed var(--line);border-radius:999px;padding:6px 10px}
/* 설정(톱니바퀴) 버튼(6-B): 헤더 오른쪽 끝. 보조 글자색, 누르거나 올리면 본문 글자색. 누르면 시연 패널을 열고 닫음 */
.gear{flex:none;width:34px;height:34px;margin-right:-6px;display:grid;place-items:center;border-radius:50%;color:var(--sub);transition:color .15s;-webkit-tap-highlight-color:transparent}
.gear svg{width:21px;height:21px;display:block}
.gear:hover,.gear:active,.gear:focus-visible,.gear.on{color:var(--text)}

.stage{position:relative;height:36%;min-height:210px;margin:0 12px;border-radius:20px;overflow:hidden;background:#140a24 center 40%/cover no-repeat;transition:background-image .6s}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
/* 배경 어둡게(4-2B): 배경 이미지와 3D 사이에 반투명 층. 필터 대신(아이폰 사파리 부담 줄이기). 값은 data/look.json background, ?bg=raw 면 끔 */
.stage{isolation:isolate}
.bgdim{position:absolute;inset:0;pointer-events:none;background:rgba(0,0,0,var(--bgDark,.2))}
.bgdim::after{content:"";position:absolute;inset:0;background:#808080;mix-blend-mode:saturation;opacity:var(--bgDesat,.1)}
.bgdim.raw{display:none}
.stage .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:13px;background:#0008}
.where{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;background:#000a;padding:5px 10px;border-radius:999px}
.mood{position:absolute;right:10px;top:10px;font-size:12px;font-weight:700;background:#000a;padding:5px 10px;border-radius:999px}
.cap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;font-weight:700;background:#000b;padding:5px 11px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s}
.cap.on{opacity:1}
.cap .new{color:var(--gold)}
.bubble{position:absolute;left:12px;right:12px;bottom:42px;background:#0d0b16e6;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;opacity:0;transform:translateY(6px);transition:.3s}
.bubble.on{opacity:1;transform:none}
/* 앨범 다시 보기 자막: 3D 아래 칸 */
.rcap{margin:8px 12px 0;min-height:0;max-height:0;overflow:hidden;background:#0d0b16;border:1px solid transparent;border-radius:14px;padding:0 12px;font-size:14px;line-height:1.45;opacity:0;transition:opacity .3s,max-height .3s,padding .3s}
.rcap.on{opacity:1;max-height:120px;padding:10px 12px;border-color:#ffffff22}
.app.inalbum .where,.app.inalbum .mood,.app.inalbum .bondchip{display:none}
.app.inalbum .cap{font-size:11px;padding:4px 9px}
.burst{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font-size:56px;opacity:0;pointer-events:none}
.burst.go{animation:burst 1.4s ease-out}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-95%) scale(1)}}

main{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;min-width:0;display:none;flex-direction:column}
.view.on{display:flex}

/* 대화 */
.log{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:12px 14px 6px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;overflow-wrap:anywhere;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.c{background:var(--card);align-self:flex-start;border-top-left-radius:6px}
.msg.u{background:var(--pri);align-self:flex-end;border-top-right-radius:6px}
.mnarr{align-self:flex-start;max-width:88%;overflow-wrap:anywhere;font-size:13px;line-height:1.55;color:#a39cb8;font-style:italic;padding:0 4px}
.mnarr.u{align-self:flex-end;text-align:right}
.msg.sys{align-self:center;background:none;color:var(--sub);font-size:12px;text-align:center;max-width:95%}
.msg.gift{align-self:flex-end;background:#2a1d47;border:1px solid #6d4bd1}
.msg .tag{display:inline-block;margin-top:5px;font-size:11px;color:var(--gold);font-weight:700}
.typing{color:var(--sub)}
.bar{display:flex;gap:8px;padding:8px 12px 12px;align-items:flex-end;min-width:0}
.gbtn{width:48px;height:48px;border-radius:50%;background:#000 url(icons/gift_button.png) center/cover;flex:none;position:relative;box-shadow:0 0 12px #a78bfa66}
.gbtn .dot{position:absolute;right:-2px;top:-2px;background:var(--gold);color:#000;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px}
/* 여러 줄 입력창: 엔터는 줄바꿈, 4줄까지 커지고 그 이상은 안에서 스크롤 (autoGrow). 16px = 아이폰 자동 확대 방지 */
.inp{flex:1;min-width:0;width:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:11px 15px;color:var(--text);font:inherit;font-size:16px;line-height:22px;outline:none;resize:none;display:block;height:46px;max-height:112px;overflow-y:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
/* 안내 문구가 길어 두 줄: 글자만 13px로 줄이고(입력 글자는 16px 그대로) 빈 칸일 때만 위아래 여백을 줄여 46px 안에 넣음 */
.inp::placeholder{color:#6b6480;font-size:13px;line-height:17px}
.inp:placeholder-shown{padding-top:5px;padding-bottom:5px;word-break:keep-all;overflow-wrap:normal}
.abtn{flex:none;height:46px;padding:0 9px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--pri2);line-height:1.15}
.send{width:46px;height:46px;border-radius:50%;background:var(--pri);font-size:18px;font-weight:800;flex:none}
.quick{display:flex;gap:6px;padding:0 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-width:0;max-width:100%;flex:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--sub)}

/* 앨범 */
.album{flex:1;overflow-y:auto;padding:12px 14px 16px}
.alh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.alh b{font-size:16px}
.alh span{color:var(--gold);font-weight:800;font-size:14px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#f472b6);border-radius:9px;transition:width .5s}
.alnote{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5}
.grp{margin-bottom:14px}
.grp h3{font-size:14px;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.grp h3 small{color:var(--sub);font-weight:500;font-size:12px}
.grp h3 .sig{margin-left:auto;font-size:11px;color:var(--gold);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{aspect-ratio:3/4;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;text-align:center;font-size:11px;position:relative;overflow:hidden}
.slot .e{font-size:24px}
.slot .s{font-weight:700}
.slot .d{color:var(--sub);font-size:10px}
.slot.got{background:linear-gradient(160deg,#2b1f4a,#1a1426);border-color:#6d4bd1}
.slot.got::after{content:"▶";position:absolute;right:6px;top:5px;font-size:10px;color:var(--pri2)}
.slot.lock .e{filter:brightness(0) invert(.25)}
.slot.lock .s{color:#6b6480}
.aseg{display:flex;gap:6px;margin-bottom:12px}
.aseg button{flex:1;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--sub)}
.aseg button.on{background:var(--pri);border-color:var(--pri);color:var(--text)}
.slot .hint{color:#9d95b5;font-size:10px;line-height:1.35;word-break:keep-all;padding:0 2px}
.slot .ln{color:#cfc8e4;font-size:10px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.soon{border:1px dashed #6d4bd1;background:#1b1628}
.slot.soon .hint{color:var(--pri2)}
/* 처음 본 모습 작은 표시: 애니메이션이 아닌 전환(transition)이라 화면을 옮겨도 다시 재생되지 않음 */
.firstchip{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top, 0px));transform:translate(-50%,-6px);background:#211b33e6;border:1px solid #f5c66b88;color:var(--gold);font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;opacity:0;transition:opacity .25s,transform .25s;z-index:29;white-space:nowrap;pointer-events:none}
.firstchip.on{opacity:1;transform:translate(-50%,0)}
.slot.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 0 #f5c66b}60%{box-shadow:0 0 0 6px #f5c66b55}100%{box-shadow:0 0 0 0 transparent}}

/* 홈 · 마이 */
.page{flex:1;overflow-y:auto;padding:4px 14px 18px}
.page h2{font-size:16px;margin:14px 0 8px}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left;position:relative}
.ch img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.ch .t{padding:8px 10px 10px}
.ch .t b{font-size:15px}.ch .t p{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.ch .b3{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;background:var(--pri);border-radius:999px;padding:2px 8px}
.ch .bond{font-size:11px;color:var(--pink);font-weight:700;margin-top:4px}
.story{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;width:100%;text-align:left}
.story .im{width:64px;height:64px;border-radius:10px;background:center/cover;flex:none}
.story b{font-size:14px}.story p{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.story .pr{margin-left:auto;font-size:12px;font-weight:800;color:var(--pri2);flex:none;text-align:right}
.story .pr.free{color:#6ee7b7}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card h3{font-size:15px;margin-bottom:6px}
.card ul{list-style:none;font-size:13px;line-height:1.9;color:#ddd6f3}
.card .cta{margin-top:10px;width:100%;padding:11px;border-radius:12px;background:var(--pri);font-weight:800;font-size:14px}
.card.plus{background:linear-gradient(150deg,#3b2470,#1b1530);border-color:#7c5cff}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.packs button{background:#0f0d16;border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:800}
.packs button small{display:block;font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
.bondbox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.bondbox .prog{flex:1;margin:0}
.bondchip{position:absolute;left:10px;top:40px;font-size:11px;font-weight:700;background:#000a;padding:4px 9px;border-radius:999px;color:#fbcfe8}
.app.nostage .stage{display:none}
.hcards{display:flex;flex-direction:column;gap:10px}
.hc{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;width:100%}
.hc .pic{width:96px;height:120px;border-radius:12px;background:center 20%/cover;flex:none;position:relative}
.hc .pic .pl{position:absolute;left:5px;bottom:5px;font-size:10px;font-weight:700;background:#000b;border-radius:999px;padding:2px 6px}
.hc .pic .bd{position:absolute;left:5px;top:5px;font-size:10px;font-weight:800;background:var(--pri);border-radius:999px;padding:2px 7px}
.hc .pic .bd.r{background:#e11d48}
.hc .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.hc .tx small{font-size:12px;color:var(--sub)}
.hc .tx b{font-size:15px;line-height:1.35}
.hc .tx p{font-size:12px;color:#cfc8e4;line-height:1.45}
.hc .tx .tg{font-size:11px;color:var(--pri2)}
.hseg{display:flex;gap:14px;margin:6px 0 12px}.hseg button{font-size:22px;font-weight:900;color:#5f5873}.hseg button.on{color:var(--text)}
.hsearch input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;font:inherit;font-size:14px;outline:none;margin-bottom:12px}
.srow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding-bottom:2px}.srow::-webkit-scrollbar{display:none}
.srow>button{flex:0 0 auto}
.pillchip{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);font-size:14px}
.pillchip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.srow.tagrow{flex-wrap:wrap;overflow:visible;margin-bottom:14px}
.fchip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.fchip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{border-radius:18px;overflow:hidden;background:var(--card);text-align:left;display:flex;flex-direction:column}
.ccard .pic{aspect-ratio:262/300;background-size:cover;background-position:center 15%;position:relative}
.ccard .pic::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(transparent,var(--card))}
.ccard .pl{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;z-index:1}
.ccard .pl.r{left:auto;right:10px;background:#e8467c}
.ccard .bd{padding:4px 12px 14px}
.ccard h3{margin:0 0 4px;font-size:15px;font-weight:900;line-height:1.35}
.ccard p{margin:0 0 6px;color:var(--sub);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .tags{color:#6b6480;font-size:12px}
.rank{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.rank .n{width:22px;font-size:18px;font-weight:900;color:var(--pri2);text-align:center}
.rank .av{width:54px;height:54px;border-radius:14px;background:center 18%/cover;flex:none}
.rank .s{font-size:13px;color:var(--sub)}.rank .tg{font-size:12px;color:#6b6480}
.empty{color:var(--sub);font-size:13px;padding:20px 0;text-align:center}
.dmempty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:64px 24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.5;word-break:keep-all}
.dmempty button{background:var(--pri);color:var(--text);font-weight:800;font-size:14px;border-radius:12px;padding:11px 20px}
.story .mo{display:block;font-size:11px;color:var(--gold);margin-top:3px;font-weight:700}
.dmhd{display:flex;align-items:baseline;gap:8px;padding:8px 14px 4px}
.dmhd h2{font-size:18px}.dmhd span{font-size:12px;color:var(--pink);font-weight:700}
.dmlist{flex:1;overflow-y:auto;padding:4px 8px 12px}
.dm{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;border-radius:14px;text-align:left}
.dm:active{background:var(--card)}
.dm .av{width:54px;height:54px;border-radius:50%;background:center 18%/cover;flex:none;position:relative}
.dm .av i{position:absolute;right:-3px;bottom:-2px;font-style:normal;font-size:9px;font-weight:800;background:var(--pri);border-radius:999px;padding:1px 5px;border:2px solid var(--bg)}
.dm .mid{flex:1;min-width:0}.dm .mid b{font-size:15px}
.dm .pv{display:block;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dm .pv.new{color:#e9e4f7}
.dm .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.dm .rt small{font-size:11px;color:var(--sub)}
.dm .ub{font-style:normal;background:#ef4444;color:#fff;font-size:11px;font-weight:800;border-radius:999px;min-width:20px;padding:2px 6px;text-align:center}
.roomhd{display:flex;align-items:center;gap:10px;padding:2px 12px 8px}
.roomhd .bk{font-size:24px;padding:0 6px 2px 0;line-height:1}
.roomhd .av{width:34px;height:34px;border-radius:50%;background:center 18%/cover}
.roomhd b{font-size:15px}.roomhd small{font-size:11px;color:var(--sub);display:block}
#room{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
nav button{position:relative}
nav .nb{position:absolute;top:4px;left:calc(50% + 6px);background:#ef4444;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px}
nav{display:flex;border-top:1px solid var(--line);background:#0e0c16}
nav button{flex:1;padding:10px 0 12px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:18px}
nav button.on{color:var(--text)}

/* 시트 */
.scrim{position:absolute;inset:0;background:#0009;display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#15131d;border-radius:20px 20px 0 0;padding:14px 14px 18px;z-index:21;transform:translateY(105%);transition:transform .28s;max-height:80%;overflow-y:auto}
.sheet.on{transform:none}
.sheet h2{font-size:16px;margin-bottom:3px}
.sheet .sub{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;position:relative}
.item .e{font-size:30px}
.gi{width:72px;height:72px;display:block;border-radius:14px;box-shadow:0 4px 14px #7c5cff44}
.gi.s{width:26px;height:26px;display:inline-block;vertical-align:-7px;border-radius:7px;box-shadow:none}

  function talk(ms){talkUntil=performance.now()+ms}

// ───────────────────────── 몸짓 재생 중 3D 확대 ─────────────────────────
// 대화 화면에서 몸짓이 나오면 3D 칸을 정사각형(높이 = 3D 칸 가로 폭 × bigAspect)까지 키우되 화면 높이의 bigMaxRatio 를 넘지 않게. 카메라는 허벅지 중간(춤은 전신)으로.
// 몸짓이 끝나고 backDelayMs 뒤 원래 높이·상반신으로. 그 사이 다음 몸짓이 오면 커진 채로. (data/config.json stage)
// 대기 몸짓(m25)과 입력창에 포커스가 있을 때(키보드)는 커지지 않는다. 앨범 다시 보기는 카메라만 바꾼다.
const View=(()=>{
  let big=false,h0=0,backT=null,tok=0;
  const cfg=()=>(DATA.config&&DATA.config.stage)||{};
  const focused=()=>document.activeElement===$("#inp");
  function keepBottom(ms){const L=$("#log"),end=performance.now()+ms;(function f(){L.scrollTop=L.scrollHeight;if(performance.now()<end)requestAnimationFrame(f)})()}
  function setBig(on,instant){
    const st=$("#stage"),ms=instant?0:(cfg().growMs||350);if(on===big)return;
    st.style.transition=`background-image .6s,height ${ms}ms ease`;
    if(on){h0=st.offsetHeight;st.style.height=h0+"px";void st.offsetHeight;st.style.height=bigH(st)+"px"}
    else{st.style.height=h0+"px";setTimeout(()=>{if(!big)st.style.height=""},ms+30)}
    big=on;keepBottom(ms+80);
  }
  // 확대 높이: 3D 칸 가로 폭 × bigAspect(1 = 정사각형), 화면 높이 × bigMaxRatio 가 상한. 예전 값(bigRatio)만 있으면 그것을 씀.
  // 대화 목록이 minLogPx(말풍선 두 줄) 아래로 줄어들 만큼 화면이 낮으면(375×667 등) 그만큼만 키움
  function bigH(st){const c=cfg(),W=st.offsetWidth,vh=window.innerHeight;
    if(c.bigAspect==null&&c.bigRatio!=null)return Math.round(vh*c.bigRatio);
    const room=st.offsetHeight+$("#log").clientHeight-(c.minLogPx!=null?c.minLogPx:80);
    return Math.round(Math.max(st.offsetHeight,Math.min(W*(c.bigAspect!=null?c.bigAspect:1),vh*(c.bigMaxRatio!=null?c.bigMaxRatio:.58),room)))}
  function rest(instant){clearTimeout(backT);tok++;setBig(false,instant);Stage.frameTo("normal",instant?0:undefined)}
  function motion(mid){
    const my=++tok;clearTimeout(backT);
    Stage.frameTo(mid==="m23"?"full":"motion");
    if(curTab==="chat"&&S.room==="seoa"&&!focused())setBig(true);
    backT=setTimeout(()=>{if(my===tok)rest()},Stage.dur(mid)*1000+(cfg().backDelayMs!=null?cfg().backDelayMs:1000));
  }
  return{motion,rest,isBig:()=>big};
})();

// *별표* = 나레이션(지문), 나머지 = 대사. 따옴표만 있으면 따옴표 안이 대사.
function msgParts(t){
  t=String(t||"");const out=[];const push=(k,x)=>{x=x.trim();if(x)out.push({k,x})};
  if(/\*[^*]+\*/.test(t)){t.split(/(\*[^*]+\*)/).forEach(seg=>{if(/^\*[^*]+\*$/.test(seg))push("n",seg.slice(1,-1));else push("d",seg.replace(/\*/g,""))})}
  else if(/[“"][^”"]+[”"]/.test(t)){t.split(/([“"][^”"]+[”"])/).forEach(seg=>{if(/^[“"][^”"]+[”"]$/.test(seg))push("d",seg.slice(1,-1));else push("n",seg)})}
  else push("d",t);
  return out.flatMap(p=>p.x.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>({k:p.k,x:p.k==="d"?x.replace(/^[“"]|[”"]$/g,""):x})));
}
const speechOnly=t=>msgParts(t).filter(p=>p.k==="d").map(p=>p.x).join(" ");
// 내 메시지: 괄호 ( ) 안 = 상황 묘사(지문), 나머지 = 말풍선. 괄호 기호는 보이지 않게. 서버에는 원문 그대로 보냄
function userParts(t){
  const out=[];const push=(k,x)=>{x=x.trim();if(x)out.push({k,x})};
  String(t||"").split(/([(（][^()（）]*[)）])/).forEach(seg=>{if(/^[(（][^()（）]*[)）]$/.test(seg))push("n",seg.slice(1,-1));else push("d",seg)});  // 말풍선 안 줄바꿈은 그대로
  return out;
}
const userPlain=t=>userParts(t).map(p=>p.x).join(" ");

// 상태 점: idle(회색, 아직) · waking(노랑) · awake(초록) · down(빨강, wakeTimeoutMs 안에 응답 없음/연결 실패)
let serverAwake=false,wakeState="idle",wakeMs=null;
function wakeServer(){const p=DATA.config.wakePath;if(!p||wakeState==="waking")return;
  wakeState="waking";const t0=performance.now(),ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),DATA.config.wakeTimeoutMs||60000);

// 답장 기다리는 시간: 깨어난 게 확인되기 전 첫 답장은 firstReplyWaitMs(45초), 그 뒤엔 replyTimeoutMs(8초)까지만 → 넘기면 예시 대사
const replyWait=()=>serverAwake?(DATA.config.replyTimeoutMs||8000):(DATA.config.firstReplyWaitMs||45000);
let lastRaw=null;  // 이번 턴 /chat 원본 응답(시연 패널 「마지막 답장」용)
// 서아 이야기 상태. 서버 v2는 저장하지 않으므로 여기 보관해서 매 요청에 보냄
const story=()=>S.story||(S.story={});
async function post(path,body,ms){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);
  const P=path==="/chat"?PERF_CUR:null;if(P)P.req=performance.now();
  const t0=performance.now(),rec=o=>{if(path==="/chat")lastRaw={ms:Math.round(performance.now()-t0),wait:ms,...o}};
  try{const r=await fetch(apiUrl()+path,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,body:JSON.stringify(body)});
    serverAwake=true;if(wakeState!=="awake"){wakeState="awake";if(typeof Demo!=="undefined")Demo.render()}
    if(!r.ok){console.warn("서버 오류",path,r.status);rec({status:r.status,error:"http"});return null}const j=await r.json();if(P)P.res=performance.now();rec({status:r.status,json:j});return j}
  catch(e){const to=e&&e.name==="AbortError";console.warn(to?"서버 답장 시간 초과 → 예시 대사":"서버에 연결 못 함 → 예시 대사",path,e&&e.name);rec({error:to?"timeout":"error"});return null}finally{clearTimeout(tm)}
}
// 서버 응답 두 형식을 한 모양으로. 예전: {reply, emotion, motions, scene} / v2: {action, dialogue, motion_id, emotion, location}
function readReply(j){
  if(!j)return null;
  if(typeof j.dialogue==="string"&&j.dialogue.trim())return{line:j.dialogue,action:j.action||null,motion:j.motion_id||null,motionNames:[],emotion:j.emotion||"",location:j.location||null};
  if(typeof j.reply==="string"&&j.reply.trim())return{line:j.reply,action:null,motion:null,motionNames:j.motions||[],emotion:j.emotion||"",location:j.scene||null};
  return null;
}
async function askServer(cid,text){
  if(noServer())return null;  // 시연 패널 「서버 없음」: 바로 예시 대사
  if(serverVer()===2){
    // v2 요청: 최근 16턴, 이야기 상태, 해금된 몸짓(직전 몸짓 제외)
    const hist=talkOf(cid).slice(0,-1).slice(-32).map(m=>({r:m.r,t:turnText(m)}));
    return readReply(await post("/chat",{char:cid,message:text,history:hist,state:cid==="seoa"?story():{},motion_list:cid==="seoa"?motionList():[]},replyWait()));
  }
  const hist=talkOf(cid).slice(-12,-1).map(m=>({r:m.r,t:turnText(m)}));
  const motions=cid==="seoa"?Object.values(allowedMotions()):[];
  const j=await post("/chat",{char:cid,message:text,session_id:(S.sid||{})[cid]||null,history:hist,scene:cid==="seoa"?SCENES[S.scene].name:null,scenes:cid==="seoa"?SCENES.map(x=>x.name):[],motions},replyWait());
  if(j&&j.session_id){(S.sid||(S.sid={}))[cid]=j.session_id;save()}
  return readReply(j);
}
function allowedMotions(){const o={};for(const id of unlockedIds())o[id]=MNAME[id]||id;return o}
// 대화에서 쓸 수 있는 몸짓 = 지금 단계까지 열린 몸짓 + 판정·사건으로 열린 몸짓 + 선물로 배운 몸짓 (서아에게 안 맞는 몸짓 제외)
function unlockedIds(){
  const U=DATA.story&&DATA.story.unlock;if(!U)return [...Object.keys(BASE),...S.learned.filter(id=>SIGN[id])];
  const set=new Set();for(let k=1;k<=curStage();k++)((U.stage[k]||{}).motions||[]).forEach(id=>set.add(id));
  (S.unlocked||[]).forEach(id=>set.add(id));S.learned.forEach(id=>set.add(id));
  return [...set].filter(id=>!(DATA.story.ban||[]).includes(id)&&canPlay(id));
}

// ───────────────────────── 관계 6단계 · 판정 · 해금 ─────────────────────────
const curStage=()=>Math.max(1,Math.min(6,story().stage||1));

let judgeP=null;
// 단계가 오르면: 시스템 메시지 + 그 단계 해금 몸짓을 대기열에
function stageUp(from,to,q){
  for(let n=from+1;n<=to;n++){
    addMsg("sys",((DATA.story||{}).stageUpMessage||"{name}").replace("{name}",stageName(n)),null,"seoa");
    const g=DATA.story&&DATA.story.unlock.stage[n];if(g)q.push(g);
  }

}
// 서버 v1·서버 없음: 대화 횟수로 한 단계씩 올림 (data/seoa_story.json countAt)
function countStage(){
  const at=(DATA.story||{}).countAt||[];const st=story(),cur=curStage();
  if(cur<6&&at[cur]!=null&&(S.bond||0)>=at[cur]){st.stage=cur+1;const q=[];stageUp(cur,cur+1,q);save();unlockShow(q)}
}
// 서버 v2: 답장을 보여 준 뒤 화면을 막지 않고 판정. 끝나기 전에 보낸 메시지는 send()가 기다렸다가 보냄
// keep: 시연 예약을 실행한 턴이면 그 단계로 고정(판정이 단계를 바꾸려 해도 예약 우선)하고, 판정 플래그 해금 연출은 건너뜀
function runJudge(lastUser,lastReply,keep){
  const st=story(),before=curStage(),gen=GEN;
  const recent=talkOf("seoa").slice(-24).map(m=>({r:m.r,t:turnText(m)}));
  const need=(S.bond||0)%6===0;
  judgeP=post("/judge",{char:"seoa",state:st,last_user:lastUser,last_reply:lastReply,need_summary:need,recent:need?recent:[]},45000)
    .then(j=>{if(!j||!j.state||gen!==GEN)return;Object.assign(st,j.state);if(keep)st.stage=keep;const q=[];
      if(curStage()>before)stageUp(before,curStage(),q);
      const F=DATA.story?DATA.story.unlock.flag:{};
      if(!keep)(j.flags||[]).forEach(f=>{const g=F[f];if(g&&(!g.minStage||curStage()>=g.minStage))q.push(g)});
      save();renderBond();unlockShow(q)})
    .catch(()=>{}).finally(()=>{judgeP=null});

  for(const k of Object.keys(U.stage).sort())if(k!=="1")U.stage[k].motions.forEach(mid=>out.push({mid,stage:+k}));

  function onKey(e){

}
const dataReady=loadData();
// 온보딩(7-A): 처음 실행일 때만(저장값 onboarded 가 없을 때). 데이터를 기다리지 않고 바로 덮어서 홈이 먼저 비치지 않게. ?skipintro=1 이면 건너뜀(개발용)
const SKIP_INTRO=qs.get("skipintro")==="1";
if(!S.onboarded&&!SKIP_INTRO)Onboard.open();
// 배경 밝기·채도(4-2B): data/look.json background. 밝기는 검은 층의 투명도(1−밝기), 채도는 회색 "채도" 섞기 층의 투명도(1−채도)
function applyBg(){const d=$("#bgdim"),b=(DATA.look&&DATA.look.background)||{};if(!d)return;
  if(qs.get("bg")==="raw"||b.on===false){d.classList.add("raw");return}
  d.style.setProperty("--bgDark",String(1-(b.brightness!=null?b.brightness:.8)));d.style.setProperty("--bgDesat",String(1-(b.saturation!=null?b.saturation:.9)))}
dataReady.then(()=>{Stage.frameTo("normal",0);applyBg();wakeServer();start();renderTop();renderBond();renderQuick();renderAlbum();setScene(S.scene||0);setTab("home");Demo.init();pingLater()});  // 시작 화면은 홈(7-A: 온보딩을 마쳤으면 바로 홈)
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("#giftBtn").onclick=()=>giftSheet();
$("#backBtn").onclick=showList;
$("#scrim").onclick=closeSheets;
$("#sendBtn").onclick=()=>send($("#inp").value);
// 엔터는 줄바꿈만(기본 동작). 전송은 화살표 버튼으로만
function autoGrow(){const t=$("#inp");t.style.height="auto";const max=parseFloat(getComputedStyle(t).maxHeight)||112;const h=Math.min(t.scrollHeight+2,max);t.style.height=h+"px";t.style.overflowY=t.scrollHeight+2>max?"auto":"hidden"}
$("#inp").addEventListener("input",autoGrow);
// 행동 버튼: 커서 자리에 "()"를 넣고 커서를 괄호 안에. 누를 때 입력창 포커스(키보드)를 잃지 않게 pointerdown 기본 동작을 막음
$("#actBtn").addEventListener("pointerdown",e=>e.preventDefault());
$("#actBtn").onclick=()=>{const t=$("#inp"),a=t.selectionStart??t.value.length,b=t.selectionEnd??a;
  t.focus();t.setRangeText("("+t.value.slice(a,b)+")",a,b,"start");t.setSelectionRange(a+1,a+1+(b-a));autoGrow()};
Stage.init();
$("#inp").addEventListener("focus",()=>{if(View.isBig())View.rest()});
// 대화 목록이 맨 아래를 보고 있었으면, 3D가 커져 목록이 줄어들어도 맨 아래(최신 말풍선)를 유지
let logStick=true;$("#log").addEventListener("scroll",()=>{const L=$("#log");logStick=L.scrollHeight-L.scrollTop-L.clientHeight<40});
if(window.ResizeObserver)new ResizeObserver(()=>{if(logStick){const L=$("#log");L.scrollTop=L.scrollHeight}}).observe($("#log"));
setTimeout(()=>{Stage.setFace(curState()==="sulky"?"sulky":"soft")},1800);
getSample();
</script>
</body>
</html>
