<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>moti</title>
<style>
:root{--bg:#0b0a12;--card:#17151f;--line:#2a2635;--text:#f2effa;--sub:#a59fb8;--pri:#8b5cf6;--pri2:#c4b5fd;--gold:#f5c66b;--pink:#f472b6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;background:#050409;color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{width:100%;max-width:440px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;overflow:clip}
header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
header h1{font-size:18px;font-weight:800;flex:none}
/* 다른 캐릭터 알림(6-C): 헤더 안, 로고와 💎 사이 빈자리에 한 줄. 길면 말줄임, 누르면 그 대화방으로 */
.hnote{flex:1;min-width:0;display:flex;justify-content:flex-start}
.hnote button{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600;color:var(--text);background:#211b33;border:1px solid #6d4bd1;border-radius:999px;padding:5px 10px;opacity:0;transform:translateY(-3px);transition:opacity .25s,transform .25s;pointer-events:none}
.hnote button.on{opacity:1;transform:none;pointer-events:auto}
.hnote button b{font-weight:800}
header h1 small{font-size:12px;color:var(--sub);font-weight:500;margin-left:6px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.demo-btn{font-size:12px;color:var(--sub);border:1px dashed var(--line);border-radius:999px;padding:6px 10px}
/* 설정(톱니바퀴) 버튼(6-B): 헤더 오른쪽 끝. 보조 글자색, 누르거나 올리면 본문 글자색. 누르면 시연 패널을 열고 닫음 */
.gear{flex:none;width:34px;height:34px;margin-right:-6px;display:grid;place-items:center;border-radius:50%;color:var(--sub);transition:color .15s;-webkit-tap-highlight-color:transparent}
.gear svg{width:21px;height:21px;display:block}
.gear:hover,.gear:active,.gear:focus-visible,.gear.on{color:var(--text)}

.stage{position:relative;height:36%;min-height:210px;margin:0 12px;border-radius:20px;overflow:hidden;background:#140a24 center 40%/cover no-repeat;transition:background-image .6s}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
/* 배경 어둡게(4-2B): 배경 이미지와 3D 사이에 반투명 층. 필터 대신(아이폰 사파리 부담 줄이기). 값은 data/look.json background, ?bg=raw 면 끔 */
.stage{isolation:isolate}
.bgdim{position:absolute;inset:0;pointer-events:none;background:rgba(0,0,0,var(--bgDark,.2))}
.bgdim::after{content:"";position:absolute;inset:0;background:#808080;mix-blend-mode:saturation;opacity:var(--bgDesat,.1)}
.bgdim.raw{display:none}
.stage .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:13px;background:#0008}
.where{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;background:#000a;padding:5px 10px;border-radius:999px}
.mood{position:absolute;right:10px;top:10px;font-size:12px;font-weight:700;background:#000a;padding:5px 10px;border-radius:999px}
.cap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;font-weight:700;background:#000b;padding:5px 11px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s}
.cap.on{opacity:1}
.cap .new{color:var(--gold)}
.bubble{position:absolute;left:12px;right:12px;bottom:42px;background:#0d0b16e6;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;opacity:0;transform:translateY(6px);transition:.3s}
.bubble.on{opacity:1;transform:none}
/* 앨범 다시 보기 자막: 3D 아래 칸 */
.rcap{margin:8px 12px 0;min-height:0;max-height:0;overflow:hidden;background:#0d0b16;border:1px solid transparent;border-radius:14px;padding:0 12px;font-size:14px;line-height:1.45;opacity:0;transition:opacity .3s,max-height .3s,padding .3s}
.rcap.on{opacity:1;max-height:120px;padding:10px 12px;border-color:#ffffff22}
.app.inalbum .where,.app.inalbum .mood,.app.inalbum .bondchip{display:none}
.app.inalbum .cap{font-size:11px;padding:4px 9px}
.burst{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font-size:56px;opacity:0;pointer-events:none}
.burst.go{animation:burst 1.4s ease-out}
/* 희귀·특별 새 몸짓 알림(9-B): 무대 위 글자 + (특별만) 무대를 살짝 어둡게. 글자·색·크기·투명도만, 전환(transition)이라 화면을 옮겨도 다시 재생되지 않음. 값 data/collection.json notify */
.gradefx{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3;background:rgba(0,0,0,var(--gfDim,0));opacity:0;transition:opacity var(--gfFade,250ms)}
.gradefx b{font-size:var(--gfSize,20px);color:var(--gfColor,#fff);font-weight:900;letter-spacing:.02em;background:#0d0b16cc;border-radius:14px;padding:6px 16px;transform:scale(.92);transition:transform var(--gfFade,250ms);text-align:center;word-break:keep-all}
.gradefx.on{opacity:1}
.gradefx.on b{transform:scale(1)}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-95%) scale(1)}}

main{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;min-width:0;display:none;flex-direction:column}
.view.on{display:flex}

/* 대화 */
.log{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:12px 14px 6px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;overflow-wrap:anywhere;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.c{background:var(--card);align-self:flex-start;border-top-left-radius:6px}
.msg.u{background:var(--pri);align-self:flex-end;border-top-right-radius:6px}
.mnarr{align-self:flex-start;max-width:88%;overflow-wrap:anywhere;font-size:13px;line-height:1.55;color:#a39cb8;font-style:italic;padding:0 4px}
.mnarr.u{align-self:flex-end;text-align:right}
.msg.sys{align-self:center;background:none;color:var(--sub);font-size:12px;text-align:center;max-width:95%}
.msg.gift{align-self:flex-end;background:#2a1d47;border:1px solid #6d4bd1}
.msg .tag{display:inline-block;margin-top:5px;font-size:11px;color:var(--gold);font-weight:700}
.typing{color:var(--sub)}
.bar{display:flex;gap:8px;padding:8px 12px 12px;align-items:flex-end;min-width:0}
/* ＋ 기능판(10-A): ＋ 버튼(누르면 ×) → 입력칸 아래(키보드 자리)에 한 줄 4칸. 아이콘은 모두 같은 선 아이콘(굵기 1.8, 둥근 끝)·같은 칸·같은 글자.
   선물하기만 칸 바탕을 보라 강조색으로(크기·모양은 같고 색으로만). 빛·그라데이션·입체·반짝이는 테두리 없음 */
.fnbtn{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:#d9d2ee;-webkit-tap-highlight-color:transparent}
.fnbtn svg{width:24px;height:24px;display:block;transition:transform .2s}
.fnbtn.on svg{transform:rotate(45deg)}
.fnp{flex:none;max-height:0;overflow:hidden;transition:max-height .22s ease;background:#0e0c16}
.fnp.on{max-height:calc(140px + env(safe-area-inset-bottom,0px))}
.fngrid{display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.fni{display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 0;-webkit-tap-highlight-color:transparent}
.fni .tile{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:#1d1a27;color:#d9d2ee;transition:transform .1s}
.fni .tile svg{width:26px;height:26px;display:block}
.fni.gift .tile{background:var(--pri);color:#fff}
.fni b{font-size:12px;font-weight:600;color:#cfc8e4}
.fni:active .tile{transform:scale(.95)}
/* 여러 줄 입력창: 엔터는 줄바꿈, 4줄까지 커지고 그 이상은 안에서 스크롤 (autoGrow). 16px = 아이폰 자동 확대 방지 */
.inp{flex:1;min-width:0;width:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:11px 15px;color:var(--text);font:inherit;font-size:16px;line-height:22px;outline:none;resize:none;display:block;height:46px;max-height:112px;overflow-y:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
/* 안내 문구가 길어 두 줄: 글자만 13px로 줄이고(입력 글자는 16px 그대로) 빈 칸일 때만 위아래 여백을 줄여 46px 안에 넣음 */
.inp::placeholder{color:#6b6480;font-size:13px;line-height:17px}
.inp:placeholder-shown{padding-top:5px;padding-bottom:5px;word-break:keep-all;overflow-wrap:normal}
.abtn{flex:none;height:46px;padding:0 9px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--pri2);line-height:1.15}
.send{width:46px;height:46px;border-radius:50%;background:var(--pri);font-size:18px;font-weight:800;flex:none}
.quick{display:flex;gap:6px;padding:0 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-width:0;max-width:100%;flex:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--sub)}

/* 앨범 */
.album{flex:1;overflow-y:auto;padding:12px 14px 16px}
.alh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.alh b{font-size:16px}
.alh span{color:var(--gold);font-weight:800;font-size:14px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#f472b6);border-radius:9px;transition:width .5s}
.alnote{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{aspect-ratio:3/4;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;text-align:center;font-size:11px;position:relative;overflow:hidden}
.slot .e{font-size:24px}
.slot .s{font-weight:700}
.slot .d{color:var(--sub);font-size:10px}
.slot.got{background:linear-gradient(160deg,#2b1f4a,#1a1426);border-color:#6d4bd1}
.slot.got::after{content:"▶";position:absolute;right:6px;top:5px;font-size:10px;color:var(--pri2)}
.slot.lock .e{filter:brightness(0) invert(.25)}
.slot.lock .s{color:#6b6480}
.aseg{display:flex;gap:6px;margin-bottom:12px}
.aseg button{flex:1;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--sub)}
.aseg button.on{background:var(--pri);border-color:var(--pri);color:var(--text)}
.slot .hint{color:#9d95b5;font-size:10px;line-height:1.35;word-break:keep-all;padding:0 2px}
.slot .ln{color:#cfc8e4;font-size:10px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.soon{border:1px dashed #6d4bd1;background:#1b1628}
.slot.soon .hint{color:var(--pri2)}
/* 처음 본 모습 작은 표시: 애니메이션이 아닌 전환(transition)이라 화면을 옮겨도 다시 재생되지 않음 */
.firstchip{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top, 0px));transform:translate(-50%,-6px);background:#211b33e6;border:1px solid #f5c66b88;color:var(--gold);font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;opacity:0;transition:opacity .25s,transform .25s;z-index:29;white-space:nowrap;pointer-events:none}
.firstchip.on{opacity:1;transform:translate(-50%,0)}
.slot.fresh{animation:fresh 1.6s ease-out}
/* 명장면 수집(9-B): 한 줄 3칸, 왼쪽 위 등급(색으로 구분), 얻은 칸 테두리도 등급 색 */
.colh{font-size:16px;margin:2px 0 10px}
/* 포토부스 버튼(11-A): 명장면 수집 제목 오른쪽 */
.colhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
.colhd .colh{margin:0}
.boothbtn{flex:none;height:32px;padding:0 13px;border-radius:10px;background:#1d1a27;border:1px solid #7c5cff;color:var(--text);font-size:13px;font-weight:700}
.boothbtn:active{background:#2a2540}
.alh.col{justify-content:space-between;margin-top:2px}
.alh.col b{font-size:13px;color:var(--sub);font-weight:700}
.slots.c3{grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.slots.c3 .slot{aspect-ratio:auto;min-height:132px;padding:24px 6px 8px;justify-content:flex-start;gap:4px}
.slot .gr{position:absolute;left:6px;top:6px;font-size:10px;font-weight:800;color:var(--gc,#a7b0c4);border:1px solid var(--gc,#a7b0c4);border-radius:999px;padding:1px 6px;line-height:1.3}
.slots.c3 .slot.got{border-color:var(--gc,#6d4bd1)}
.slots.c3 .slot .e{font-size:22px}
.slots.c3 .slot .s{font-size:12px;line-height:1.3;word-break:keep-all}
.slot .d.pl{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slots.c3 .slot.lock .gr{opacity:.75}
@keyframes fresh{0%{box-shadow:0 0 0 0 #f5c66b}60%{box-shadow:0 0 0 6px #f5c66b55}100%{box-shadow:0 0 0 0 transparent}}

/* 홈 · 마이 */
.page{flex:1;overflow-y:auto;padding:4px 14px 18px}
.page h2{font-size:16px;margin:14px 0 8px}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left;position:relative}
.ch img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.ch .t{padding:8px 10px 10px}
.ch .t b{font-size:15px}.ch .t p{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.ch .b3{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;background:var(--pri);border-radius:999px;padding:2px 8px}
.ch .bond{font-size:11px;color:var(--pink);font-weight:700;margin-top:4px}
.story{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;width:100%;text-align:left}
.story .im{width:64px;height:64px;border-radius:10px;background:center/cover;flex:none}
.story b{font-size:14px}.story p{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.story .pr{margin-left:auto;font-size:12px;font-weight:800;color:var(--pri2);flex:none;text-align:right}
.story .pr.free{color:#6ee7b7}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card h3{font-size:15px;margin-bottom:6px}
.card ul{list-style:none;font-size:13px;line-height:1.9;color:#ddd6f3}
.card .cta{margin-top:10px;width:100%;padding:11px;border-radius:12px;background:var(--pri);font-weight:800;font-size:14px}
.card.plus{background:#17132a;border-color:#3b2f6b}
.mbh{display:flex;align-items:center;gap:8px;margin-bottom:12px}.mbh b{font-size:16px}
.mbh .lv{font-size:11.5px;font-weight:800;color:#f0a6c8;background:rgba(244,114,182,.12);border-radius:6px;padding:2px 7px}
.mbh .nx{margin-left:auto;font-size:12px;color:var(--sub)}
.mybond .prog i{background:#f472b6}
.mrow{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub)}.mrow b{color:var(--text);font-weight:700}
.mph{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.mph .wm{font-size:18px;font-weight:900;letter-spacing:-.3px}.mph .wm span{color:#a78bfa}
.mph .pp{margin-left:auto;font-size:12px;color:var(--sub)}.mph .pp b{color:var(--text);font-size:14px}
.mph .on{margin-left:auto;font-size:12px;color:#6ee7b7;font-weight:700}
.card ul.perks{line-height:1.4;font-size:13.5px;color:#e6e1f5}
.perks li{display:flex;align-items:center;gap:11px;padding:5px 0}
.perks em{font-style:normal;font-size:11.5px;color:var(--sub);margin-left:6px}
.perks .mi{width:30px;height:30px;border-radius:9px;background:rgba(167,139,250,.12);color:#a78bfa;display:flex;align-items:center;justify-content:center;flex:none}
.perks .mi svg{width:17px;height:17px}
.card .fine{text-align:center;font-size:11px;color:var(--dim,#6b6878);margin:8px 0 0}
.mch{display:flex;align-items:center;margin-bottom:12px}.mch b{font-size:16px}
.mch .bal{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;background:#1f1d27;border-radius:999px;padding:4px 10px 4px 7px}
.packs .amt{display:flex;align-items:center;justify-content:center;gap:4px;font-size:15px}
.packs button{position:relative}
.packs button.hot{border-color:#8b5cf6}
.packs .tg{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;background:#8b5cf6;border-radius:999px;padding:1px 7px;white-space:nowrap}
.gem{display:block;flex:none}
.dpill{display:inline-flex;align-items:center;gap:5px}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.packs button{background:#0f0d16;border:1px solid var(--line);border-radius:12px;padding:13px 4px 11px;font-size:13px;font-weight:800}
.packs button small{display:block;font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
.bondbox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.bondbox .prog{flex:1;margin:0}
.bondchip{position:absolute;left:10px;top:40px;font-size:11px;font-weight:700;background:#000a;padding:4px 9px;border-radius:999px;color:#fbcfe8}
.app.nostage .stage{display:none}
.hcards{display:flex;flex-direction:column;gap:10px}
.hc{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;width:100%}
.hc .pic{width:96px;height:120px;border-radius:12px;background:center 20%/cover;flex:none;position:relative}
.hc .pic .pl{position:absolute;left:5px;bottom:5px;font-size:10px;font-weight:700;background:#000b;border-radius:999px;padding:2px 6px}
.hc .pic .bd{position:absolute;left:5px;top:5px;font-size:10px;font-weight:800;background:var(--pri);border-radius:999px;padding:2px 7px}
.hc .pic .bd.r{background:#e11d48}
.hc .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.hc .tx small{font-size:12px;color:var(--sub)}
.hc .tx b{font-size:15px;line-height:1.35}
.hc .tx p{font-size:12px;color:#cfc8e4;line-height:1.45}
.hc .tx .tg{font-size:11px;color:var(--pri2)}
.srow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding-bottom:2px}.srow::-webkit-scrollbar{display:none}
.srow>button{flex:0 0 auto}
.pillchip{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);font-size:14px}
.pillchip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.ccard{border-radius:18px;overflow:hidden;background:var(--card);text-align:left;display:flex;flex-direction:column}
.ccard .pic{aspect-ratio:262/300;background-size:cover;background-position:center 15%;position:relative}
.ccard .pic::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(transparent,var(--card))}
.ccard .pl{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;z-index:1}
.ccard .pl.r{left:auto;right:10px;background:#e8467c}
.ccard .bd{padding:4px 12px 14px}
.ccard h3{margin:0 0 4px;font-size:15px;font-weight:900;line-height:1.35}
.ccard p{margin:0 0 6px;color:var(--sub);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .tags{color:#6b6480;font-size:12px}
/* 홈 카드 가로 넘기기(8-B). --ph = 카드 그림 높이(화면 높이에 맞춰 줄어듦: 844 → 260px, 667 → 245px, 8-2). 옆 카드는 크기·투명도만(blur 없음) */
/* 8-1: 카드 크기 값은 여기 한 곳. --hcMax 그림 최대 높이(390×844 에서 특별 에피소드 첫 칸까지 보이게), --hcMin 최소, --hcGap 화면 높이에서 뺄 값, --hcRatio 카드 폭 = 그림 높이 × 비율(그림 비율 유지) */
.hcar{--hcMax:260px;--hcMin:170px;--hcGap:422px;--hcRatio:.84;--ph:clamp(var(--hcMin),calc(100dvh - var(--hcGap)),var(--hcMax));--cw:calc(var(--ph)*var(--hcRatio));position:relative;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;margin:2px -14px 0;padding:4px calc(50% - var(--cw)/2) 6px;touch-action:pan-x pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.hcar::-webkit-scrollbar{display:none}
.hcar.drag{scroll-snap-type:none;cursor:grabbing}
.hcar.drag .hcard{transition:none}
.hcard{flex:0 0 var(--cw);width:var(--cw);scroll-snap-align:center;scroll-snap-stop:always;border:2px solid transparent;transform:scale(.9);opacity:.5;transition:transform .22s,opacity .22s,border-color .22s;-webkit-tap-highlight-color:transparent}
.hcard.on{transform:none;opacity:1;border-color:var(--pri2)}
.hcard .pic{aspect-ratio:auto;height:var(--ph);-webkit-user-drag:none}
.hcard .bd{padding:2px 12px 12px}
.hcard .nm{display:block;font-size:13px;color:var(--pri2);font-weight:800;margin-bottom:2px}
.hcard h3{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.hcard .tags{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdots{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
.hdots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s}
.hdots i.on{width:16px;background:var(--pri2)}
#hEps h2{margin:10px 0 7px;font-size:15px}
.ep{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ep .tx{flex:1;min-width:0}.ep b{font-size:14px}.ep p{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.ep .eb,.story .eb{flex:none;height:32px;line-height:32px;padding:0 14px;border-radius:16px;background:var(--pri);color:#fff;font-size:13px;font-weight:800}
.eb.adult{background:#e11d48}
.story .eb{margin-left:auto}
.epsoon{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--sub);font-size:13px}
.empty{color:var(--sub);font-size:13px;padding:20px 0;text-align:center}
.dmempty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:64px 24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.5;word-break:keep-all}
.dmempty button{background:var(--pri);color:var(--text);font-weight:800;font-size:14px;border-radius:12px;padding:11px 20px}
.story .mo{display:block;font-size:11px;color:var(--gold);margin-top:3px;font-weight:700}
.dmhd{display:flex;align-items:baseline;gap:8px;padding:8px 14px 4px}
.dmhd h2{font-size:18px}.dmhd span{font-size:12px;color:var(--pink);font-weight:700}
.dmlist{flex:1;overflow-y:auto;padding:4px 8px 12px}
.dm{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;border-radius:14px;text-align:left}
.dm:active{background:var(--card)}
.dm .av{width:54px;height:54px;border-radius:50%;background:center 18%/cover;flex:none;position:relative}
.dm .av i{position:absolute;right:-3px;bottom:-2px;font-style:normal;font-size:9px;font-weight:800;background:var(--pri);border-radius:999px;padding:1px 5px;border:2px solid var(--bg)}
.dm .mid{flex:1;min-width:0}.dm .mid b{font-size:15px}
.dm .pv{display:block;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dm .pv.new{color:#e9e4f7}
.dm .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.dm .rt small{font-size:11px;color:var(--sub)}
.dm .ub{font-style:normal;background:#ef4444;color:#fff;font-size:11px;font-weight:800;border-radius:999px;min-width:20px;padding:2px 6px;text-align:center}
.roomhd{display:flex;align-items:center;gap:10px;padding:2px 12px 8px}
.roomhd .bk{font-size:24px;padding:0 6px 2px 0;line-height:1}
.roomhd .av{width:34px;height:34px;border-radius:50%;background:center 18%/cover}
.roomhd b{font-size:15px}.roomhd small{font-size:11px;color:var(--sub);display:block}
/* 16: 에피소드 중 「본 이야기로」 */
.roomhd .thr{margin-left:auto;font-size:11px;font-weight:700;color:var(--pri2,#c4b5fd);border:1px solid #6d4bd1;border-radius:999px;padding:5px 10px;white-space:nowrap;max-width:52%;overflow:hidden;text-overflow:ellipsis}
#room{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
nav button{position:relative}
nav .nb{position:absolute;top:-5px;left:15px;min-width:17px;height:17px;line-height:17px;text-align:center;background:#8b5cf6;color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:0 5px}
nav{display:flex;border-top:.5px solid rgba(255,255,255,.08);background:#0e0c16}
nav button{flex:1;padding:9px 0 11px;font-size:11px;color:#6b6878;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-tap-highlight-color:transparent}

nav button:active b{transform:scale(.9)}
nav button.on{color:#fff;font-weight:700}nav button.on b svg{stroke-width:2.1}

/* 시트 */
.scrim{position:absolute;inset:0;background:#0009;display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#15131d;border-radius:20px 20px 0 0;padding:14px 14px 18px;z-index:21;transform:translateY(105%);transition:transform .28s;max-height:80%;overflow-y:auto}
.sheet.on{transform:none}
.sheet h2{font-size:16px;margin-bottom:3px}
.sheet .sub{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.5}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;position:relative}
.item .e{font-size:30px}
.gi{width:72px;height:72px;display:block;border-radius:14px;box-shadow:0 4px 14px #7c5cff44}
.gi.s{width:26px;height:26px;display:inline-block;vertical-align:-7px;border-radius:7px;box-shadow:none}
.burst img{width:120px;height:120px;border-radius:24px;box-shadow:0 0 30px #a78bfa88}
.item b{display:block;font-size:14px;margin-top:4px}
.item .p{font-size:12px;color:var(--pri2);font-weight:700}
.item .rec{position:absolute;right:8px;top:8px;font-size:10px;font-weight:800;background:var(--gold);color:#000;border-radius:999px;padding:2px 7px}
.item.focus{border-color:var(--gold)}
/* 선물 창(9-A): 기분 맞춤 선물은 금색 테두리, 확률 줄, 천장 남은 횟수 */
.item.match{border-color:#f5c66b99;background:linear-gradient(160deg,#2a2236,#1a1426)}
.item .odds{font-size:10.5px;letter-spacing:-.02em;color:var(--sub);margin-top:4px;line-height:1.4;white-space:nowrap}
.item.match .odds{color:#e9dcc0}
.sheet .pity{font-size:12px;font-weight:700;color:var(--pri2);margin:-2px 0 10px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.row button{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--card)}
.row button.on{background:var(--pri);border-color:var(--pri)}
.demo h4{font-size:13px;margin:4px 0 2px}
.demo p{font-size:11px;color:var(--sub);line-height:1.5}
.toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top, 0px));transform:translate(-50%,-10px);background:#211b33;border:1px solid #6d4bd1;color:var(--text);font-size:13px;font-weight:600;padding:9px 14px;border-radius:12px;opacity:0;transition:.3s;z-index:30;width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.45}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 시연 설정 패널(5단계): 헤더의 톱니바퀴 버튼(6-B)으로 열고 닫음. 문구는 data/demo.json */
.dp{position:fixed;top:0;right:0;bottom:0;width:min(340px,calc(100vw - 28px));background:#120f1cf5;border-left:1px solid var(--line);z-index:61;transform:translateX(102%);transition:transform .25s;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px calc(18px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--text)}
.dp.on{transform:none}
.dp .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dp .hd b{font-size:15px;flex:1}
.dp .hd .dbg{font-size:10px;font-weight:800;color:#000;background:var(--gold);border-radius:999px;padding:1px 7px}
.dp .hd button{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

.dp .row{margin:4px 0 6px;gap:5px}
.dp .row button{padding:5px 9px}
.dp .now{font-size:11px;color:var(--sub);background:#0006;border-radius:8px;padding:5px 8px;line-height:1.5}
.dp .now b{color:var(--text)}
.dp .now .rs{color:var(--gold)}
.dp .st{display:flex;align-items:center;gap:6px;margin:4px 0}
.dp .dot{width:10px;height:10px;border-radius:50%;background:#6b6480;flex:none}
.dp .dot.waking{background:#facc15}.dp .dot.awake{background:#22c55e}.dp .dot.down{background:#ef4444}
.dp .kv{color:var(--sub);line-height:1.5}
.dp details{margin-top:4px}
.dp summary{cursor:pointer;color:var(--pri2)}
.dp pre{white-space:pre-wrap;word-break:break-all;font-size:10px;line-height:1.4;background:#0008;border-radius:8px;padding:6px 8px;margin-top:4px;max-height:220px;overflow:auto}
.dp input[type=range]{flex:1;min-width:0;accent-color:var(--pri)}
.dp .aff{display:flex;align-items:center;gap:8px}
.dp .aff b{width:28px;text-align:right}
.dp .mlist{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.dp .mrow{display:flex;align-items:center;gap:5px}
.dp .mrow .pl{flex:1;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp .mrow .pl i{font-style:normal;color:var(--sub);font-size:10px;margin-left:4px}
.dp .mrow .pl.open i{color:#86efac}
.dp .mrow .pv{flex:none;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;color:var(--gold)}
.dp .keys{margin-top:12px;font-size:10px;color:var(--sub);line-height:1.5}
/* 장 제목: 장면에 들어갈 때 대화 화면 가운데 2초 (투명도·크기 전환만) */

.chapter.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

const Stage=(()=>{

  let R,scene,cam,md=null,cur=null,lastEnd=null,shadowM=null;const shV=new THREE.Vector3();let xsData=null,faces=[],lookInfo=null,aliveOn=false,aliveInfo=null,faceKey=null,faceEmo="";

  // 화면(대화 무대)은 다음 프레임에 원래 자세로 다시 그려지므로 바뀐 자세가 보이지 않는다(그사이 브라우저가 화면을 그리지 않음).
  // 머리카락(J_Sec_)은 지금 흔들림 값 그대로 둠(기본 자세로 돌리면 몸을 뚫을 수 있어서). o.shadow: 발밑 그림자, o.place: 테두리 빛 장소
  const qSave=()=>{const q={};for(const n in md.bones)q[n]=md.bones[n].quaternion.clone();return q};
  function still(mid,mt,fk,draw,o={}){
    if(!md)return false;
    const keepQ=qSave(),keepP=md.root.position.clone(),keepM=faces.map(f=>f.morphTargetInfluences.slice()),hadShadow=!!(shadowM&&shadowM.parent);
    const rimBack=o.place!=null&&typeof Look!=="undefined"&&Look.rimFor?Look.rimFor(o.place):()=>{};
    try{
      const isXs=!!XS[mid],d=dur(mid);mt=Math.max(0,Math.min(d-.001,mt||0));
      const p=RIG.pose(md.rest,isXs?null:mid,mt,performance.now()/1000);
      for(const b in p.local){if(/^J_Sec_/.test(b))continue;const qq=p.local[b];if(md.bones[b])md.bones[b].quaternion.set(qq[0],qq[1],qq[2],qq[3])}
      md.root.position.set(p.off[0],p.off[1],p.off[2]);
      if(isXs&&xsData)xsApply(xsData,mt,XS[mid]);
      md.root.updateMatrixWorld(true);
      const F=FACE[fk]||FACE.soft||{},names=new Set([...Object.keys(faceW),...Object.keys(F),"Fcl_EYE_Close",...talkVis(talkCfg())]);
      for(const n of names){const v=n==="Fcl_EYE_Close"?0:(F[n]||0);for(const f of faces){const ix=f.morphTargetDictionary[n];if(ix!==undefined)f.morphTargetInfluences[ix]=v}}
      if(o.shadow){shadow(true,o.shadow);const hb=md.bones.Hips,hp=hb?hb.getWorldPosition(new THREE.Vector3()):md.root.position;shadowM.position.set(hp.x,.004,hp.z)}
      draw();
    }finally{
      for(const n in keepQ)md.bones[n].quaternion.copy(keepQ[n]);md.root.position.copy(keepP);md.root.updateMatrixWorld(true);
      faces.forEach((f,i)=>{const a=keepM[i];for(let k=0;k<a.length;k++)f.morphTargetInfluences[k]=a[k]});
      if(o.shadow&&!hadShadow)shadow(false);rimBack();
    }
    return true;
  }
  // still 의 draw 안에서만: 목·머리·눈을 target(월드 좌표, 보통 카메라 자리) 쪽으로 돌림(셀카 「렌즈를 봄」). 뼈마다 몫 k, 최대 각도 maxDeg
  // 뼈의 앞(기본 자세에서 +Z, 카메라 쪽)이 지금 어디를 보는지 = 지금 월드 회전 · 기본 자세 월드 회전⁻¹ 로 +Z 를 돌린 것
  const AXZ=new THREE.Vector3(0,0,1);
  function aimBone(name,target,k,maxDeg){const b=md.bones[name],r=md.rest[name];if(!b||!r||!b.parent||!k)return;
    const wq=b.getWorldQuaternion(new THREE.Quaternion()),rw=new THREE.Quaternion(r.world[0],r.world[1],r.world[2],r.world[3]);
    const fwd=AXZ.clone().applyQuaternion(wq.clone().multiply(rw.invert())).normalize(),want=target.clone().sub(b.getWorldPosition(new THREE.Vector3())).normalize();
    const d=new THREE.Quaternion().setFromUnitVectors(fwd,want),ang=2*Math.acos(Math.min(1,Math.abs(d.w)));
    const t=Math.min(k,ang>1e-4?maxDeg*Math.PI/180/ang:1),dq=new THREE.Quaternion().slerp(d,t);
    const pq=b.parent.getWorldQuaternion(new THREE.Quaternion()).invert();b.quaternion.copy(pq.multiply(dq.multiply(wq)));b.updateMatrixWorld(true)}
  function aimAt(target,o={}){if(!md)return;md.root.updateMatrixWorld(true);
    aimBone(md.bones.neck?"neck":"Neck",target,o.neck!=null?o.neck:.3,o.neckMax||20);aimBone("Head",target,o.head!=null?o.head:.7,o.headMax||35);
    ["J_Adj_L_FaceEye","J_Adj_R_FaceEye"].forEach(n=>aimBone(n,target,o.eyes!=null?o.eyes:1,o.eyeMax||12))}
  return{outfit:k=>setOutfit(k),init,ready,aimAt,readyMs:()=>readyMs,borrow,release,fog,recentMotion,camLoop,hold,shadow,center,lock,freeze,faceNow,bg,still,blending:()=>!!blend,three:()=>({R,scene,cam}),isPlaying:()=>!!cur,play,setFace,talk,talkFor,alive:()=>aliveInfo,mouth:()=>({...mw}),frameTo,dur,height,last:()=>lastMid,recent:n=>recent.slice(-n),lookInfo:()=>lookInfo,renderInfo:()=>({calls:R.info.render.calls,triangles:R.info.render.triangles})};
})();

// ───────────────────────── 몸짓 재생 중 3D 확대 ─────────────────────────
// 대화 화면에서 몸짓이 나오면 3D 칸을 정사각형(높이 = 3D 칸 가로 폭 × bigAspect)까지 키우되 화면 높이의 bigMaxRatio 를 넘지 않게. 카메라는 허벅지 중간(춤은 전신)으로.
// 몸짓이 끝나고 backDelayMs 뒤 원래 높이·상반신으로. 그 사이 다음 몸짓이 오면 커진 채로. (data/config.json stage)
// 대기 몸짓(m25)과 입력창에 포커스가 있을 때(키보드)는 커지지 않는다. 앨범 다시 보기는 카메라만 바꾼다.
const View=(()=>{
  let big=false,h0=0,backT=null,tok=0;
  const cfg=()=>(DATA.config&&DATA.config.stage)||{};
  const focused=()=>document.activeElement===$("#inp");
  function keepBottom(ms){const L=$("#log"),end=performance.now()+ms;(function f(){L.scrollTop=L.scrollHeight;if(performance.now()<end)requestAnimationFrame(f)})()}
  function setBig(on,instant){
    const st=$("#stage"),ms=instant?0:(cfg().growMs||350);if(on===big)return;
    st.style.transition=`background-image .6s,height ${ms}ms ease`;
    if(on){h0=st.offsetHeight;st.style.height=h0+"px";void st.offsetHeight;st.style.height=bigH(st)+"px"}
    else{st.style.height=h0+"px";setTimeout(()=>{if(!big)st.style.height=""},ms+30)}
    big=on;keepBottom(ms+80);
  }
  // 확대 높이: 3D 칸 가로 폭 × bigAspect(1 = 정사각형), 화면 높이 × bigMaxRatio 가 상한. 예전 값(bigRatio)만 있으면 그것을 씀.
  // 대화 목록이 minLogPx(말풍선 두 줄) 아래로 줄어들 만큼 화면이 낮으면(375×667 등) 그만큼만 키움
  function bigH(st){const c=cfg(),W=st.offsetWidth,vh=window.innerHeight;
    if(c.bigAspect==null&&c.bigRatio!=null)return Math.round(vh*c.bigRatio);
    const room=st.offsetHeight+$("#log").clientHeight-(c.minLogPx!=null?c.minLogPx:80);
    return Math.round(Math.max(st.offsetHeight,Math.min(W*(c.bigAspect!=null?c.bigAspect:1),vh*(c.bigMaxRatio!=null?c.bigMaxRatio:.58),room)))}
  function rest(instant){clearTimeout(backT);tok++;setBig(false,instant);Stage.frameTo("normal",instant?0:undefined)}
  function motion(mid,sp){
    const my=++tok;clearTimeout(backT);
    Stage.frameTo(mid==="m23"?"full":"motion");
    if(curTab==="chat"&&S.room==="seoa"&&!focused())setBig(true);
    backT=setTimeout(()=>{if(my===tok)rest()},Stage.dur(mid)/(sp||1)*1000+(cfg().backDelayMs!=null?cfg().backDelayMs:1000));
  }
  return{motion,rest,isBig:()=>big};
})();

// *별표* = 나레이션(지문), 나머지 = 대사. 따옴표만 있으면 따옴표 안이 대사.
function msgParts(t){
  t=String(t||"");const out=[];const push=(k,x)=>{x=x.trim();if(x)out.push({k,x})};
  if(/\*[^*]+\*/.test(t)){t.split(/(\*[^*]+\*)/).forEach(seg=>{if(/^\*[^*]+\*$/.test(seg))push("n",seg.slice(1,-1));else push("d",seg.replace(/\*/g,""))})}
  else if(/[“"][^”"]+[”"]/.test(t)){t.split(/([“"][^”"]+[”"])/).forEach(seg=>{if(/^[“"][^”"]+[”"]$/.test(seg))push("d",seg.slice(1,-1));else push("n",seg)})}
  else push("d",t);
  return out.flatMap(p=>p.x.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>({k:p.k,x:p.k==="d"?x.replace(/^[“"]|[”"]$/g,""):x})));
}
const speechOnly=t=>msgParts(t).filter(p=>p.k==="d").map(p=>p.x).join(" ");
// 내 메시지: 괄호 ( ) 안 = 상황 묘사(지문), 나머지 = 말풍선. 괄호 기호는 보이지 않게. 서버에는 원문 그대로 보냄
function userParts(t){
  const out=[];const push=(k,x)=>{x=x.trim();if(x)out.push({k,x})};
  String(t||"").split(/([(（][^()（）]*[)）])/).forEach(seg=>{if(/^[(（][^()（）]*[)）]$/.test(seg))push("n",seg.slice(1,-1));else push("d",seg)});  // 말풍선 안 줄바꿈은 그대로
  return out;
}
const userPlain=t=>userParts(t).map(p=>p.x).join(" ");

function addMsg(r,t,extra,cid){cid=cid||S.room||"seoa";const L=chatOf(cid);L.push({r,t,at:Date.now(),...(extra||{})});if(L.length>60)S.chats[cid]=L.slice(-60);
  if(S.room===cid&&curTab==="chat")S.read[cid]=chatOf(cid).length;save();if(S.room===cid)renderLog();renderUnread()}
function renderLog(){

    m.r==="g"?`<div class="msg gift">${esc(m.t)}</div>`:

    m.r==="c"?(m.act?`<div class="mnarr">${esc(m.act)}</div>`:"")+msgParts(m.t).map((p,i,a)=>p.k==="n"?`<div class="mnarr">${esc(p.x)}</div>`:`<div class="msg c">${esc(p.x)}</div>`).join("")
    :m.r==="u"?userParts(m.t).map(p=>p.k==="n"?`<div class="mnarr u">${esc(p.x)}</div>`:`<div class="msg u">${esc(p.x)}</div>`).join("")

  L.scrollTop=L.scrollHeight;

const emoFace=e=>{for(const x of DATA.face.map||[]){try{if(new RegExp(x.match,"i").test(e||""))return x.face}catch(err){}}return DATA.face.default||"soft"};
// 대화 기록 → 서버로 보낼 모양 ("*행동* 대사"). 인트로 문단은 서버가 OPENING으로 따로 넣으므로 뺌
const turnText=m=>(m.act?`*${m.act}* `:"")+m.t;
const talkOf=cid=>chatOf(cid).filter(m=>(m.r==="u"||m.r==="c")&&!m.intro);
// 서버 깨우기: 앱을 열 때 가벼운 요청을 미리 보냄(응답은 기다리지 않음). 깨어난 게 확인되기 전 첫 답장은 오래 기다림
// 상태 점: idle(회색, 아직) · waking(노랑) · awake(초록) · down(빨강, wakeTimeoutMs 안에 응답 없음/연결 실패)
let serverAwake=false,wakeState="idle",wakeMs=null;
function wakeServer(){const p=DATA.config.wakePath;if(!p||wakeState==="waking")return;
  wakeState="waking";const t0=performance.now(),ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),DATA.config.wakeTimeoutMs||60000);
  if(typeof Demo!=="undefined")Demo.render();
  fetch(apiUrl()+p,{mode:"no-cors",cache:"no-store",signal:ctl.signal})
    .then(()=>{serverAwake=true;wakeState="awake";renderLog()}).catch(()=>{wakeState="down"})
    .finally(()=>{clearTimeout(tm);wakeMs=Math.round(performance.now()-t0);if(typeof Demo!=="undefined")Demo.render()})}
// 답장 기다리는 시간: 깨어난 게 확인되기 전 첫 답장은 firstReplyWaitMs(45초), 그 뒤엔 replyTimeoutMs(8초)까지만 → 넘기면 예시 대사
const replyWait=()=>serverAwake?(DATA.config.replyTimeoutMs||8000):(DATA.config.firstReplyWaitMs||45000);
let lastRaw=null;  // 이번 턴 /chat 원본 응답(시연 패널 「마지막 답장」용)
// 서아 이야기 상태. 서버 v2는 저장하지 않으므로 여기 보관해서 매 요청에 보냄
const story=()=>S.story||(S.story={});
async function post(path,body,ms){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);
  const P=path==="/chat"?PERF_CUR:null;if(P)P.req=performance.now();
  const t0=performance.now(),rec=o=>{if(path==="/chat")lastRaw={ms:Math.round(performance.now()-t0),wait:ms,...o}};
  try{const r=await fetch(apiUrl()+path,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,body:JSON.stringify(body)});
    serverAwake=true;if(wakeState!=="awake"){wakeState="awake";if(typeof Demo!=="undefined")Demo.render()}
    if(!r.ok){console.warn("서버 오류",path,r.status);rec({status:r.status,error:"http"});return null}const j=await r.json();if(P)P.res=performance.now();rec({status:r.status,json:j});return j}
  catch(e){const to=e&&e.name==="AbortError";console.warn(to?"서버 답장 시간 초과 → 예시 대사":"서버에 연결 못 함 → 예시 대사",path,e&&e.name);rec({error:to?"timeout":"error"});return null}finally{clearTimeout(tm)}
}
// 서버 응답 두 형식을 한 모양으로. 예전: {reply, emotion, motions, scene} / v2: {action, dialogue, motion_id, emotion, location}
function readReply(j){
  if(!j)return null;
  if(typeof j.dialogue==="string"&&j.dialogue.trim())return{line:j.dialogue,action:j.action||null,motion:j.motion_id||null,motionNames:[],emotion:j.emotion||"",location:j.location||null};
  if(typeof j.reply==="string"&&j.reply.trim())return{line:j.reply,action:null,motion:null,motionNames:j.motions||[],emotion:j.emotion||"",location:j.scene||null};
  return null;
}
async function askServer(cid,text){
  if(noServer())return null;  // 시연 패널 「서버 없음」: 바로 예시 대사
  if(serverVer()===2){
    // v2 요청: 최근 16턴, 이야기 상태, 해금된 몸짓(직전 몸짓 제외)
    const hist=talkOf(cid).slice(0,-1).slice(-32).map(m=>({r:m.r,t:turnText(m)}));
    const pn=photoNote(cid,hist);
    const j=await post("/chat",{char:cid,message:text,history:hist,state:cid==="seoa"?story():{},motion_list:cid==="seoa"?motionList():[]},replyWait());
    if(j&&pn)SeoaPhoto.noteDone();
    return readReply(j);
  }
  const hist=talkOf(cid).slice(-12,-1).map(m=>({r:m.r,t:turnText(m)}));
  const pn=photoNote(cid,hist);
  const motions=cid==="seoa"?Object.values(allowedMotions()):[];
  const j=await post("/chat",{char:cid,message:text,session_id:(S.sid||{})[cid]||null,history:hist,scene:cid==="seoa"?SCENES[S.scene].name:null,scenes:cid==="seoa"?SCENES.filter(x=>!x.episode).map(x=>x.name):[],motions},replyWait());
  if(j&&j.session_id){(S.sid||(S.sid={}))[cid]=j.session_id;save()}
  if(j&&pn)SeoaPhoto.noteDone();

  if(v.scene!=null&&SCENES[v.scene]&&v.scene!==S.scene&&(v.src==="server"||!S.placeLock)){setScene(v.scene);addMsg("sys",`📍 장소가 바뀌었어요 · ${SCENES[v.scene].name}`,null,"seoa")}
  // 몸짓: 서버가 준 몸짓 → 지문의 행동 단어 → 대기 동작 유지
  const emo=v.emotion||(DATA.motions.faceEmotion||{})[v.face]||"";
  const mid=pickMotion(v.motion,actionText(v));
  const msg={...(v.action?{act:v.action}:{}),...(emo?{emo}:{}),...(mid?{mid}:{})};
  addMsg("c",v.line,msg,"seoa");
  // 촬영 중(10-B): 답장은 대화 기록에만. 몸짓·표정·입은 촬영 화면을 나올 때 마지막 답장 것으로
  if(Cam.isOpen())Cam.hold({r:{m:mid||IDLE,f:v.face,t:v.line,e:emo},mid});
  else{react({m:mid||IDLE,f:v.face,t:v.line,e:emo},"");firstSeen(mid)}
  afterReply(v);
  SeoaPhoto.afterReply();  // 12: 대화 중 가끔 서아 사진
  // 시연 예약(장면 바로가기): 답장이 보인 뒤 예약된 단계 상승·사건 해금을 실행하고 지움. 이 턴은 판정·대화 횟수가 단계를 바꾸지 못함
  const R=S.demoNext;let keep=null;
  if(R){S.demoNext=null;keep=Scenes.runReserve(R)}
  // 관계: 서버 v2 답장이면 판정으로, 아니면(서버 v1·서버 없음) 대화 횟수로
  if(serverVer()===2&&v.src==="server"){
    const ev=!R&&usedEvent&&DATA.story&&DATA.story.unlock.event[usedEvent];if(ev)unlockShow([ev]);  // 사건 해금은 그 사건 답장 뒤에
    runJudge(text,turnText(talkOf("seoa").slice(-1)[0]),keep);
  }else if(!R)countStage();
  renderBond();renderTop();perfEnd(P);
  if(prevMood!==S.mood&&!S.force&&!S.birthday){const g=GIFTS.find(x=>x.rec===S.mood);toast(`${STATES[S.mood].e} 서아가 <b>${STATES[S.mood].ko}</b> 상태가 됐어요`+(g&&S.mood!=="normal"?`<br><small>🎁 ${g.e} ${g.name}을(를) 주면 특별한 반응이 있을지도…?</small>`:""))}
}
// 답장 뒤 이야기 상태 갱신: 최근 서아 응답 3개(반복 방지), 장소, 쓴 사건 비우기
function afterReply(v){
  const st=story(),last=talkOf("seoa").slice(-1)[0];
  if(last&&last.r==="c")st.recent_lines=[...(st.recent_lines||[]),turnText(last)].slice(-3);
  if(v.location)st.location=v.location;
  if(v.src==="server")st.pending_event=null;save();

// ───────────────────────── 선물 ─────────────────────────
function openSheet(id){$("#scrim").classList.add("on");$(id).classList.add("on")}
function closeSheets(){$("#scrim").classList.remove("on");document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("on"))}
// 선물 창(9-A, 원고 3절): 기분 안내 · 천장 남은 횟수 · 선물마다 기분 맞춤 표시와 확률 줄
const gradeKo=g=>UI("collection.grade."+g);
function giftSheet(focus){
  const st=curState(),B=GIFT.moodBonus||{};
  const oddsLine=o=>UI("gift.odds",{a:o.common,b:o.rare,c:o.special});
  $("#giftSheet").innerHTML=`<h2>🎁 서아에게 선물하기</h2>
  <p class="sub">${esc(UI("gift.moodNote",{mood:STATES[st].e+" "+STATES[st].ko,bonus:B.rare||0}))}</p>
  <div class="pity">${esc(UI("gift.pity",{n:pityLeft()}))}</div>
  <div class="items">${GIFTS.map(g=>{const m=g.rec===st,o=Gacha.odds(g,m,B);return `<button class="item ${m?"match":""} ${focus===g.id?"focus":""}" data-g="${g.id}">
    ${m?`<span class="rec">${esc(UI("gift.match"))}</span>`:""}
    <img class="gi" src="${g.icon}" alt=""><b>${esc(g.name)}</b><div class="p">💎 ${g.price}</div>
    <div class="odds">${esc(oddsLine(o))}</div></button>`}).join("")}</div>`;
  $("#giftSheet").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>give(b.dataset.g));
  openSheet("#giftSheet");
}
// 3D 무대 위 자막(대화방에서 선물 대사). 앨범 다시 보기는 3D 아래 칸(#rcap)
let subT;
function stageSub(text){text=speechOnly(text);const b=$("#bubble");if(!text||!b)return;b.textContent=text;b.classList.add("on");clearTimeout(subT);subT=setTimeout(()=>b.classList.remove("on"),Math.max(3500,text.length*120))}
// 선물 몸짓 재생(임시 재생 설정 play: 몸짓·표정·속도)
function playGift(it,o={}){const p=it.play||{};Stage.play(p.m,{name:it.name,speed:p.speed,tag:o.tag||"",ref:it.id});Stage.setFace(p.f||"soft");faceReset()}
// 선물 주기: 💎 빼기 → 확률로 등급(기분 맞춤·천장 반영, 시연 패널 「다음 선물 결과」가 있으면 그것) → 그 등급 선물 몸짓 하나 → 무대에서 재생 + 대사 자막 + 대화 기록 → 도감
function give(id){
  const g=gBy(id),st=curState();
  if(S.dia<g.price){toast(esc(UI("gift.noDia")));return}
  closeSheets();setTab("chat");openRoom("seoa");
  S.dia-=g.price;
  const matched=g.rec===st,F=S.giftNext;S.giftNext=null;
  let it=F&&F.item?colBy(F.item):null,grade=it?it.grade:F&&F.grade?F.grade:Gacha.rollGrade(Gacha.odds(g,matched,GIFT.moodBonus),pityLeft(),GIFT.pity);
  if(!it)it=Gacha.pickItem(COL.items,grade);
  S.pity=Gacha.nextPity(grade,pityLeft(),GIFT.pity);
  const line=Gacha.line(g,grade,matched),isNew=!S.col[it.id];
  if(isNew)S.col[it.id]={at:Date.now(),line,scene:S.scene};
  save();renderTop();
  burst(g.icon);
  setTimeout(()=>{
    playGift(it);stageSub(line);
    addMsg("g",UI("gift.logTag",{gift:g.name,grade:gradeKo(grade)}));
    addMsg("c",line,{gift:it.id});
    if(st==="sulky"&&!S.force){S.mood="normal"}  // 예전 규칙 그대로(삐짐은 선물로 풀림). 관계 단계·호감도는 그대로
    renderTop();save();
    if(isNew)notifyNew(it);else toast(esc(UI("collection.already")),2200);
    if(curTab==="album")renderAlbum(it.id);
  },700);
}

// ───────────────────────── 앨범 ─────────────────────────
const fmtD=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
// 명장면 수집(9-B): 위 3D 무대 + 「전체 / 대화 / 선물」 묶음 + 진행도 + 몸짓 칸(한 줄 3칸). 칸 순서 = 대화 → 선물, 그 안에서 일반 → 희귀 → 특별
let albumSeg="all";
const SEGS=["all","chat","gift"];
function colList(seg){const O=COL.gradeOrder||Gacha.ORDER,src=["chat","gift"];
  return COL.items.map((x,i)=>({x,i})).filter(o=>seg==="all"||o.x.source===seg)
    .sort((a,b)=>src.indexOf(a.x.source)-src.indexOf(b.x.source)||O.indexOf(a.x.grade)-O.indexOf(b.x.grade)||a.i-b.i).map(o=>o.x)}
function renderAlbum(fresh){
  if(!SEGS.includes(albumSeg))albumSeg="all";

  const gc=x=>(G[x.grade]&&G[x.grade].color)||"#a7b0c4";
  const badge=x=>`<span class="gr">${esc(gradeKo(x.grade))}</span>`;
  const place=a=>a.scene!=null&&SCENES[a.scene]?SCENES[a.scene].name:"";
  $("#album").innerHTML=`<div class="colhd"><h2 class="colh">${esc(UI("album.title"))}</h2><button class="boothbtn" id="boothBtn">${esc(UI("booth.albumBtn"))}</button></div>
  <div class="aseg">${SEGS.map(k=>`<button data-seg="${k}" class="${albumSeg===k?"on":""}">${esc(UI("album.seg."+k))}</button>`).join("")}</div>
  <div class="alh col"><b>${esc(UI("album.progress."+albumSeg))}</b><span>${esc(UI("album.count",{n:got,total:L.length}))}</span></div>
  <div class="prog"><i style="width:${L.length?got/L.length*100:0}%"></i></div>
  <div class="slots c3">${L.map(x=>{const a=S.col[x.id];
    if(a)return `<button class="slot got ${fresh===x.id?"fresh":""}" style="--gc:${gc(x)}" data-f="${x.id}">${badge(x)}<span class="e">${x.source==="gift"?"🎁":"💬"}</span><span class="s">${esc(x.name)}</span><span class="d">${fmtD(a.at)}</span><span class="d pl">${esc(place(a))}</span></button>`;
    const soon=x.source==="chat"&&x.stage!==1&&isSoon(x.id),  // 9-1: 1단계(처음부터 열린) 몸짓은 「수집 대기 중」 대신 잠긴 칸
      h=soon?(DATA.story||{}).soonText||"":hints[x.id]||UI("album.hint."+x.source);
    return `<button class="slot lock ${soon?"soon":""}" style="--gc:${gc(x)}" data-h="${x.id}">${badge(x)}<span class="e">${soon?"✨":"👤"}</span><span class="hint">${esc(h)}</span></button>`}).join("")}</div>`;
  $("#album").querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{albumSeg=b.dataset.seg;renderAlbum()});
  $("#boothBtn").onclick=()=>Booth.open();
  $("#album").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>replayCol(b.dataset.f));
  $("#album").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const x=colBy(b.dataset.h),h=hints[x.id]||UI("album.hint."+x.source);toast(esc(h),2600)});
}
// 얻은 칸 다시 보기: 그때 장소에서 그 몸짓 + 대사 자막(3D 아래 칸). 장소는 다시 보기 동안만
function replayCol(id){
  const x=colBy(id),a=S.col[id];if(!x||!a)return;
  const t=a.line||a.text||"",ln=speechOnly(t),gift=x.source==="gift",m=gift?(x.play||{}).m:x.id,sp=gift?((x.play||{}).speed||1):1;
  const ms=Math.max(Stage.dur(m)/sp*1000,Math.max(3500,Math.min(ln.length,70)*120))+300;  // 몸짓과 자막 중 늦게 끝나는 쪽
  if(a.scene!=null)sceneForReplay(a.scene,ms);

// ───────────────────────── 시연 설정 패널 (5단계) ─────────────────────────
// 헤더 오른쪽 위 톱니바퀴(6-B, 단축키 D)로 열고 닫음. 항상: 장면 바로가기·서버 깨우기·오프닝·전체 초기화·💎·기분. ?debug=1 일 때만 나머지.
// 관계·해금 규칙은 바꾸지 않고 상태만 바꾼다. 문구는 data/demo.json
let GEN=0;  // 초기화·장면 이동마다 +1. 그 전에 시작한 답장·판정·인트로는 결과를 버림
const Demo=(()=>{
  const T=(k,vars)=>{let v=k.split(".").reduce((o,x)=>o!=null?o[x]:undefined,DATA.demo||{});if(typeof v!=="string")v=k;for(const n in vars||{})v=v.split("{"+n+"}").join(vars[n]);return v};
  let open=false,last=null,jsonOpen=false;

  function setOpen(on){open=on;DS.open=on;saveDS();P().classList.toggle("on",on);P().setAttribute("aria-hidden",on?"false":"true");const g=$("#gearBtn");g.classList.toggle("on",on);g.setAttribute("aria-expanded",on?"true":"false");if(on)render()}
  const toggle=()=>setOpen(!open);
  // 3D를 보여 주는 동작 뒤: 좁은 화면(휴대폰)이면 패널이 대화 화면을 가리지 않게 접음
  const reveal=()=>{if(window.innerWidth<800&&open)setOpen(false)};
  // 진행 중인 답장·판정·인트로·해금 연출을 멈춤
  function cancel(){
    GEN++;busy=false;waiting=false;judgeP=null;unlockQ=[];unlockBusy=false;
    introT.forEach(clearTimeout);introT=[];clearTimeout(sceneBackT);closeSheets();Cam.close();Booth.close();PhotoUI.closeView();Fn.set(false);
    ["#toast","#firstChip","#rcap","#bubble","#gradeFx"].forEach(s=>$(s).classList.remove("on"));
    View.rest(true);Stage.play(IDLE);
  }
  function refresh(){save();renderTop();renderBond();
    if(curTab==="album")renderAlbum();else if(curTab==="my")renderMy();else if(curTab==="home")renderHome();else if(S.room)renderLog();else renderList();
    renderUnread();render()}
  const U=()=>(DATA.story&&DATA.story.unlock)||{stage:{},flag:{},event:{}};
  const stageMotions=k=>(U().stage[k]||{}).motions||[];
  // 단계 n 으로: 그 단계까지의 몸짓은 열고, 위 단계 몸짓은 닫음. 대화 횟수·호감도도 그 단계 시작값으로(이후 진행이 자연스럽게)
  function setStage(n){

    for(let k=2;k<=n;k++)stageMotions(k).forEach(id=>{if(!S.unlocked.includes(id))S.unlocked.push(id)});

  function reset(k){if(k!=="album")cancel();RESET[k]();refresh();toast(esc(T("resetToast",{name:k==="all"?T("resetAll"):T("resets."+k)})),1800);if(k==="all")reveal()}
  // 온보딩(7-A): 다시 보기 = onboarded 만 지우고 첫 화면부터. 장면 0 「앱 처음 열기」 = 전체 초기화 후 첫 화면
  const OT=k=>Onboard.T(k);
  function replayOnboard(){cancel();delete S.onboarded;save();setTab("home");Onboard.open();refresh();reveal()}
  function firstOpen(){cancel();RESET.all();refresh();reveal()}
  // 오프닝 다시 보기: 서아 대화를 비우고 오프닝부터 (관계·앨범은 그대로)
  function opening(){cancel();S.epOutfit=null;S.thread="main";if(S.threads)delete S.threads.main;S.chats.seoa=[];S.read.seoa=0;if(S.sid)delete S.sid.seoa;story().recent_lines=[];S.introDone=false;start();
    setTab("chat");openRoom("seoa");refresh();reveal()}
  function setMood(k){S.force=null;S.birthday=k==="birthday";if(k!=="birthday")S.mood=k;
    Stage.setFace(curState()==="sulky"?"sulky":curState()==="tired"?"sorrow":"neutral");faceReset();refresh()}
  // ── 몸짓 ──
  const allMotions=()=>COL.items.filter(x=>x.source==="chat").map(x=>x.id);  // 대화 몸짓 = 도감의 대화 칸(unlock 전부, ban 제외)
  function groupOf(mid){const u=U();for(const sec of ["stage","flag","event"])for(const k in u[sec]||{}){const g=u[sec][k];if((g.motions||[]).includes(mid))return g}return null}
  function toChat(){setTab("chat");if(S.room!=="seoa")openRoom("seoa");const i=$("#inp");if(document.activeElement===i)i.blur();reveal()}
  function playMotion(mid){toChat();Stage.play(mid)}
  function preview(mid){toChat();const g=groupOf(mid);unlockFx(mid,g&&g.text||"")}
  // ── 그리기 ──
  const B=(a,label,o={})=>`<button data-a="${a}"${o.v!=null?` data-v="${esc(o.v)}"`:""} class="${o.on?"on":""} ${o.cls||""}"${o.title?` title="${esc(o.title)}"`:""}>${label}</button>`;
  function lastHtml(){

    h+=`<h4>${esc(T("sec.server"))}</h4><div class="st"><span class="dot ${wakeState}"></span><span>${esc(T("wake."+wakeState))}${wakeMs!=null&&wakeState!=="waking"?" · "+esc(T("wake.ms",{ms:wakeMs})):""}</span><span class="kv">· ${esc(T("serverModes."+serverMode()))}</span></div>
      <div class="row">${B("wake",esc(T("wake.button")))}</div>`;
    h+=`<h4>${esc(T("sec.quick"))}</h4><div class="row">${B("opening",esc(T("opening")))}${B("replayOnboard",esc(OT("demo.replay")))}${B("adultReset",esc(OT("demo.adultReset")))}${B("resetAll",esc(T("resetAll")))}${B("dia",esc(T("dia")))}</div>`;
    h+=`<h4>${esc(T("sec.mood"))}</h4><div class="row">${SORDER.map(k=>B("mood",`${STATES[k].e} ${esc(T("moods."+k))}`,{v:k,on:curState()===k})).join("")}</div>`;
    // 선물(9-B): 다음 선물 결과(등급 또는 선물 몸짓, 다음 선물 한 번에만) · 천장 초기화 · 선물 몸짓 모두 열기 · 비우기

const Scenes=(()=>{
  const L=()=>(DATA.scenes&&DATA.scenes.scenes)||[];

  function go(n){

      Demo.setStage(sc.stage||1);
      const pi=SCENES.findIndex(x=>x.name===sc.place);setScene(pi>=0?pi:0);
      const md=sc.mood||"normal";S.force=null;S.birthday=md==="birthday";S.mood=md==="birthday"?"normal":md;
      // 예약된 연출이 매번 다시 나오게: 이 장면 단계보다 위 몸짓·예약 사건 몸짓의 해금과 앨범 기록을 지움
      const drop=new Set();for(let k=(sc.stage||1)+1;k<=6;k++)(((DATA.story||{}).unlock||{stage:{}}).stage[k]||{motions:[]}).motions.forEach(id=>drop.add(id));
      if(sc.next&&sc.next.event)evMotions(sc.next.event).forEach(id=>drop.add(id));
      drop.forEach(id=>delete S.col[id]);S.unlocked=S.unlocked.filter(id=>!drop.has(id));

  // 예약 실행. 돌려주는 값 = 이 턴에 고정할 단계
  function runReserve(R){
    const q=[],st=story(),D=DATA.story||{};

  function click(a,v){if(a==="scene"){go(+v);return true}return false}
  // 단축키: ?debug=1 일 때만, 입력창에 글자를 치는 중에는 무시
  function onKey(e){
    if(!DEBUG||e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
    const t=e.target;if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
    const c=e.code,n=L().length;let m;
    if(c==="Digit0"||c==="Numpad0")Demo.firstOpen();  // 장면 0 앱 처음 열기(7-A)
    else if((m=/^(Digit|Numpad)([1-9])$/.exec(c))&&+m[2]<=n)go(+m[2]);
    else if(c==="ArrowRight")go(Math.min(n,cur()+1));

// 카드 가로 넘기기(8-B): 브라우저 스크롤 + 가운데 맞춤 스냅(scroll-snap). 가운데에 가장 가까운 카드가 고른 카드.
// 옆 카드를 누르면 가운데로. 노트북: 마우스 휠(세로 휠은 한 장씩)·끌기. ←/→ 키는 시연 패널 단축키라 홈에서는 쓰지 않음
const Car=(()=>{
  let el=null,ids=[],cur=-1,raf=0,wheelAt=0,drag=null,moved=false;
  const cards=()=>el?[...el.children]:[];
  function nearest(){const mid=el.scrollLeft+el.clientWidth/2;let best=0,bd=1e9;cards().forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;best=i}});return best}
  function mark(i){
    cards().forEach((c,k)=>c.classList.toggle("on",k===i));
    document.querySelectorAll("#hDots i").forEach((d,k)=>d.classList.toggle("on",k===i));
    if(i!==cur){cur=i;H.pick=ids[i];renderEps(ids[i])}
  }
  function go(i,smooth=true){const c=cards()[i];if(!c)return;el.scrollTo({left:c.offsetLeft+c.offsetWidth/2-el.clientWidth/2,behavior:smooth?"smooth":"auto"});mark(i)}
  function onMove(e){if(!drag||!el)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>5&&!moved){moved=true;el.classList.add("drag")}if(moved)el.scrollLeft=drag.l-dx}
  function onUp(){if(!drag||!el){drag=null;return}const was=moved;drag=null;el.classList.remove("drag");if(was){go(nearest());setTimeout(()=>moved=false,0)}}
  window.addEventListener("pointermove",onMove);window.addEventListener("pointerup",onUp);
  function mount(node,list){
    el=node;ids=list;cur=-1;drag=null;moved=false;
    const i0=Math.max(0,ids.indexOf(H.pick));
    go(i0,false);requestAnimationFrame(()=>{if(el===node)go(i0,false)});  // 탭이 막 보였을 때 한 번 더(크기 반영 뒤)
    el.addEventListener("scroll",()=>{if(drag)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>mark(nearest()))},{passive:true});
    cards().forEach((c,k)=>c.onclick=e=>{if(moved){e.preventDefault();return}if(k!==cur)go(k)});  // 가운데 카드를 누르면 아무 일 없음(들어가기는 에피소드 버튼)

function start(){
  if(!S.chats.seoa||!S.chats.seoa.length){
    // 인트로 원고(data/seoa_intro.json)가 있으면 처음 들어갈 때 대화방 안에서 문단별로 보여 줌. 없으면 예전 한 줄 인트로
    S.chats.seoa=[{r:"sys",t:UI("chat.seoaFirst")},...(DATA.intro&&!S.introDone?[]:[{r:"c",t:chBy("seoa").intro,at:Date.now()-(chBy("seoa").firstMin||7)*60000}])];
  }
  if(!S.story.stage)S.story.stage=1;
  if(!S.story.location&&SCENES[S.scene||0])S.story.location=SCENES[S.scene||0].name;
  CH.forEach(c=>chatOf(c.id));
}
const dataReady=loadData();
// 온보딩(7-A): 처음 실행일 때만(저장값 onboarded 가 없을 때). 데이터를 기다리지 않고 바로 덮어서 홈이 먼저 비치지 않게. ?skipintro=1 이면 건너뜀(개발용)
const SKIP_INTRO=qs.get("skipintro")==="1";
if(!S.onboarded&&!SKIP_INTRO)Onboard.open();
if(FilmShot.on)FilmShot.start();  // 개발용 필름 사진 만들기(7-2, film.js)
// 배경 밝기·채도(4-2B): data/look.json background. 밝기는 검은 층의 투명도(1−밝기), 채도는 회색 "채도" 섞기 층의 투명도(1−채도)
function applyBg(){const d=$("#bgdim"),b=(DATA.look&&DATA.look.background)||{};if(!d)return;
  if(qs.get("bg")==="raw"||b.on===false){d.classList.add("raw");return}
  d.style.setProperty("--bgDark",String(1-(b.brightness!=null?b.brightness:.8)));d.style.setProperty("--bgDesat",String(1-(b.saturation!=null?b.saturation:.9)))}
dataReady.then(()=>{Stage.frameTo("normal",0);applyBg();wakeServer();start();renderTop();renderBond();renderQuick();$("#navAlbum").textContent=UI("nav.album");
  document.querySelectorAll("#fnPanel [data-fn]").forEach(b=>b.querySelector("b").textContent=UI("fn."+b.dataset.fn));Fn.set(false);Photos.init();SeoaPhoto.init();renderAlbum();setScene(S.scene||0);setTab("home");Demo.init();pingLater()});  // 시작 화면은 홈(7-A: 온보딩을 마쳤으면 바로 홈)
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
// ＋ 기능판(10-A): ＋ → 입력칸 아래 기능판(＋는 ×로), 입력칸을 누르면 닫힘. 선물하기는 예전 선물 창 그대로
const Fn=(()=>{let on=false;
  function set(v){on=!!v;const p=$("#fnPanel"),b=$("#fnBtn");if(!p)return;p.classList.toggle("on",on);p.setAttribute("aria-hidden",on?"false":"true");
    b.classList.toggle("on",on);b.setAttribute("aria-expanded",on?"true":"false");b.setAttribute("aria-label",UI(on?"fn.close":"fn.open"));
    if(on){const i=$("#inp");if(document.activeElement===i)i.blur();const L=$("#log");setTimeout(()=>{L.scrollTop=L.scrollHeight},240)}}
  function run(k){set(false);if(k==="gift")giftSheet();else if(k==="camera")Cam.open();else if(k==="photo")PhotoUI.sheet()}
  return{set,toggle:()=>set(!on),run,isOn:()=>on}})();
$("#fnBtn").onclick=()=>Fn.toggle();
document.querySelectorAll("#fnPanel [data-fn]").forEach(b=>b.onclick=()=>Fn.run(b.dataset.fn));
$("#inp").addEventListener("pointerdown",()=>Fn.set(false));
$("#backBtn").onclick=showList;
$("#scrim").onclick=closeSheets;
$("#sendBtn").onclick=()=>send($("#inp").value);
// 엔터는 줄바꿈만(기본 동작). 전송은 화살표 버튼으로만
function autoGrow(){const t=$("#inp");t.style.height="auto";const max=parseFloat(getComputedStyle(t).maxHeight)||112;const h=Math.min(t.scrollHeight+2,max);t.style.height=h+"px";t.style.overflowY=t.scrollHeight+2>max?"auto":"hidden"}
$("#inp").addEventListener("input",autoGrow);
// 행동 버튼: 커서 자리에 "()"를 넣고 커서를 괄호 안에. 누를 때 입력창 포커스(키보드)를 잃지 않게 pointerdown 기본 동작을 막음
$("#actBtn").addEventListener("pointerdown",e=>e.preventDefault());
$("#actBtn").onclick=()=>{const t=$("#inp"),a=t.selectionStart??t.value.length,b=t.selectionEnd??a;
  t.focus();t.setRangeText("("+t.value.slice(a,b)+")",a,b,"start");t.setSelectionRange(a+1,a+1+(b-a));autoGrow()};
Stage.init();
$("#inp").addEventListener("focus",()=>{Fn.set(false);if(View.isBig())View.rest()});
// 대화 목록이 맨 아래를 보고 있었으면, 3D가 커져 목록이 줄어들어도 맨 아래(최신 말풍선)를 유지
let logStick=true;$("#log").addEventListener("scroll",()=>{const L=$("#log");logStick=L.scrollHeight-L.scrollTop-L.clientHeight<40});
if(window.ResizeObserver)new ResizeObserver(()=>{if(logStick){const L=$("#log");L.scrollTop=L.scrollHeight}}).observe($("#log"));
setTimeout(()=>{Stage.setFace(curState()==="sulky"?"sulky":"soft")},1800);
getSample();
</script>
</body>
</html>
